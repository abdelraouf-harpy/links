<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, follow">
  <script>
    (function() {
      var path = window.location.pathname || '';
      var s = window.location.search || '';
      var h = window.location.hash || '';
      var segs = path.split('/').filter(Boolean);
      var sub = segs.filter(function(x) { return x !== 'order.html' && x !== 'order'; });
      var params = new URLSearchParams(s);
      if (sub.length > 0 && !params.get('m')) {
        params.set('m', sub[0]);
      }
      var q = params.toString() ? ('?' + params.toString()) : '';
      window.location.replace('./order/' + q + h);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./order/">
  <title>المنيو الإلكتروني الذكي — Harpy Order</title>
</head>
<body style="background:#070B13; color:#faf6f0; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; font-family:'Cairo',system-ui,sans-serif;">
  <p style="font-size:1.1rem; font-weight:700;">جاري فتح المنيو...</p>
</body>
</html>
