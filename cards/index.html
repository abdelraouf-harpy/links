<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HARPY CARDS — سجّل وابدأ</title>
  <meta name="description" content="بطاقة بيزنس رقمية ذكية — اضغط وشارك معلوماتك بـ NFC" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:           #06060f;
      --surface:      #0d0d1f;
      --card:         rgba(255,255,255,0.04);
      --border:       rgba(255,255,255,0.09);
      --primary:      #7c3aed;
      --primary-lt:   #a78bfa;
      --primary-glow: rgba(124,58,237,0.28);
      --pink:         #db2777;
      --text:         #f1f5f9;
      --muted:        #94a3b8;
      --dim:          #64748b;
      --success:      #10b981;
      --error:        #ef4444;
      --warn:         #f59e0b;
      --radius:       14px;
      --ease:         cubic-bezier(0.4,0,0.2,1);
    }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated background ── */
    .bg-layer {
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%;
      filter: blur(90px); opacity: 0.12;
      animation: drift linear infinite;
    }
    .orb-1 { width:700px; height:700px; background:var(--primary); top:-250px; right:-150px; animation-duration:22s; }
    .orb-2 { width:500px; height:500px; background:var(--pink);    bottom:-150px; left:-120px; animation-duration:18s; animation-direction:reverse; }
    .orb-3 { width:350px; height:350px; background:#06b6d4;        top:40%; left:40%; animation-duration:28s; }

    @keyframes drift {
      0%   { transform:translate(0,0) rotate(0deg); }
      25%  { transform:translate(40px,-40px) rotate(90deg); }
      50%  { transform:translate(0,-80px) rotate(180deg); }
      75%  { transform:translate(-40px,-40px) rotate(270deg); }
      100% { transform:translate(0,0) rotate(360deg); }
    }

    /* ── Grid lines bg ── */
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; opacity: 0.03;
      background-image:
        linear-gradient(rgba(255,255,255,.8) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.8) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    /* ── Wrapper ── */
    .wrapper {
      position: relative; z-index: 1;
      width: 100%; max-width: 460px;
      padding: 20px;
      animation: slideInUp .6s var(--ease) both;
    }
    @keyframes slideInUp {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Brand ── */
    .brand { text-align:center; margin-bottom:28px; }
    .brand-logo {
      display: inline-flex; align-items:center; gap:12px;
      text-decoration:none; margin-bottom:8px;
    }
    .brand-icon {
      width:50px; height:50px;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      border-radius:15px; font-size:24px;
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 0 35px var(--primary-glow);
    }
    .brand-name {
      font-size:26px; font-weight:900; letter-spacing:-1px;
      background: linear-gradient(135deg, var(--primary-lt), var(--pink));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .brand-tag { color:var(--muted); font-size:14px; }

    /* ── Card ── */
    .auth-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 24px; padding: 36px;
      backdrop-filter: blur(24px);
      box-shadow: 0 30px 60px rgba(0,0,0,.55);
    }

    /* ── Tabs ── */
    .tabs {
      display:flex; background:rgba(255,255,255,0.05);
      border-radius:10px; padding:4px; gap:4px; margin-bottom:28px;
    }
    .tab-btn {
      flex:1; padding:10px; border:none; border-radius:8px;
      background:transparent; color:var(--muted);
      font-size:14px; font-weight:600; cursor:pointer;
      transition:.3s var(--ease); font-family:inherit;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--pink));
      color:white; box-shadow:0 4px 16px var(--primary-glow);
    }

    /* ── Form ── */
    .form-section { display:none; }
    .form-section.active { display:block; }

    .form-group { margin-bottom:16px; }
    .form-label {
      display:block; font-size:12px; font-weight:600;
      color:var(--muted); margin-bottom:7px;
      text-transform:uppercase; letter-spacing:.5px;
    }
    .form-input {
      width:100%; padding:13px 16px;
      background:rgba(255,255,255,0.05);
      border:1px solid var(--border);
      border-radius:10px; color:var(--text);
      font-size:14px; font-family:inherit;
      outline:none; transition:.25s var(--ease);
    }
    .form-input::placeholder { color:var(--dim); }
    .form-input:focus {
      border-color:var(--primary);
      background:rgba(124,58,237,0.09);
      box-shadow:0 0 0 3px var(--primary-glow);
    }
    .form-input.is-error  { border-color:var(--error);   background:rgba(239,68,68,.07); }
    .form-input.is-ok     { border-color:var(--success);  background:rgba(16,185,129,.07); }

    .hint { font-size:12px; margin-top:5px; color:var(--dim); }
    .hint.error   { color:var(--error); }
    .hint.success { color:var(--success); }

    /* Username row */
    .uname-wrap { position:relative; }
    .uname-badge {
      position:absolute; top:50%; transform:translateY(-50%);
      left:14px; font-size:15px; transition:.25s;
    }
    [dir="rtl"] .uname-badge { left:14px; right:auto; }
    .form-input.uname-field { padding-left:40px; direction:ltr; text-align:left; }

    /* Password strength */
    .strength-bars { display:flex; gap:5px; margin-top:7px; }
    .s-bar {
      flex:1; height:3px; border-radius:3px;
      background:var(--border); transition:.3s;
    }
    .s-bar.lvl-1 { background:var(--error); }
    .s-bar.lvl-2 { background:var(--warn); }
    .s-bar.lvl-3 { background:var(--success); }

    /* Submit */
    .btn-submit {
      width:100%; padding:14px;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      border:none; border-radius:10px;
      color:white; font-size:15px; font-weight:700;
      cursor:pointer; transition:.25s var(--ease);
      font-family:inherit; margin-top:6px;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-submit:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 10px 30px var(--primary-glow); }
    .btn-submit:disabled { opacity:.6; cursor:not-allowed; }
    .btn-spinner {
      width:18px; height:18px; border:2px solid rgba(255,255,255,.35);
      border-top-color:white; border-radius:50%;
      animation:spin .7s linear infinite; display:none;
    }
    .btn-submit.loading .btn-txt    { display:none; }
    .btn-submit.loading .btn-spinner { display:block; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Toast ── */
    #toasts {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center;
    }
    .toast {
      padding:12px 22px; border-radius:10px;
      font-size:14px; font-weight:600; color:white;
      backdrop-filter:blur(16px);
      box-shadow:0 8px 28px rgba(0,0,0,.35);
      animation:toastIn .3s var(--ease);
      min-width:240px; text-align:center;
    }
    .toast.success { background:rgba(16,185,129,.92); }
    .toast.error   { background:rgba(239,68,68,.92); }
    .toast.info    { background:rgba(124,58,237,.92); }
    @keyframes toastIn {
      from { opacity:0; transform:translateY(16px); }
      to   { opacity:1; transform:translateY(0); }
    }

    @media(max-width:480px) {
      .auth-card { padding:24px 18px; }
      .wrapper { padding:14px; }
    }
  </style>
</head>
<body>

<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="grid-bg"></div>

<div class="wrapper">
  <div class="brand">
    <a class="brand-logo" href="#">
      <div class="brand-icon">💳</div>
      <span class="brand-name">HARPY CARDS</span>
    </a>
    <p class="brand-tag">بطاقة بيزنس رقمية — اضغط وشارك</p>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login"    onclick="switchTab('login')">دخول</button>
      <button class="tab-btn"        id="tab-register" onclick="switchTab('register')">تسجيل</button>
    </div>

    <!-- ── LOGIN ── -->
    <div class="form-section active" id="sec-login">
      <div class="form-group">
        <label class="form-label" for="l-email">البريد الإلكتروني</label>
        <input type="email" id="l-email" class="form-input" placeholder="example@email.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="l-pass">كلمة المرور</label>
        <input type="password" id="l-pass" class="form-input" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-submit" id="btn-login" onclick="doLogin()">
        <span class="btn-txt">دخول 🚀</span>
        <div class="btn-spinner"></div>
      </button>
    </div>

    <!-- ── REGISTER ── -->
    <div class="form-section" id="sec-register">
      <div class="form-group">
        <label class="form-label" for="r-name">الاسم الكامل</label>
        <input type="text" id="r-name" class="form-input" placeholder="أحمد محمد" autocomplete="name" />
      </div>

      <div class="form-group">
        <label class="form-label" for="r-uname">اليوزرنيم (رابط بطاقتك)</label>
        <div class="uname-wrap">
          <input type="text" id="r-uname" class="form-input uname-field"
                 placeholder="ahmed" autocomplete="off"
                 oninput="checkUsername(this.value)" />
          <span class="uname-badge" id="uname-badge"></span>
        </div>
        <p class="hint" id="uname-hint">رابطك: harpymenu.com/cards/profile.html?u=ahmed</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="r-email">البريد الإلكتروني</label>
        <input type="email" id="r-email" class="form-input" placeholder="example@email.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label class="form-label" for="r-pass">كلمة المرور</label>
        <input type="password" id="r-pass" class="form-input" placeholder="••••••••"
               autocomplete="new-password" oninput="checkStrength(this.value)" />
        <div class="strength-bars">
          <div class="s-bar" id="sb1"></div>
          <div class="s-bar" id="sb2"></div>
          <div class="s-bar" id="sb3"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="r-conf">تأكيد كلمة المرور</label>
        <input type="password" id="r-conf" class="form-input" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label class="form-label" for="r-code">كود التفعيل (Activation Code)</label>
        <input type="text" id="r-code" class="form-input" placeholder="HARPY-XXXX-XXXX" style="direction: ltr; text-align: left;" autocomplete="off" />
      </div>

      <button class="btn-submit" id="btn-register" onclick="doRegister()">
        <span class="btn-txt">إنشاء الحساب ✨</span>
        <div class="btn-spinner"></div>
      </button>
    </div>
  </div>

  <p style="text-align:center;color:var(--dim);font-size:12px;margin-top:18px;">
    © 2025 HARPY CARDS — جميع الحقوق محفوظة
  </p>
</div>

<div id="toasts"></div>

<script type="module">
import { auth, db } from "./js/firebase-config.js";
import { createUserWithEmailAndPassword,
         signInWithEmailAndPassword, onAuthStateChanged }        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc, getDoc, updateDoc }                     from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* redirect if already logged in */
onAuthStateChanged(auth, user => {
  if (user) window.location.href = 'dashboard.html';
});

/* ── helpers ── */
function toast(msg, type = 'info') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast ${type}`; t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3600);
}

function setLoading(btnId, on) {
  const b = document.getElementById(btnId);
  b.classList.toggle('loading', on);
  b.disabled = on;
}

/* ── tab switch ── */
window.switchTab = function(tab) {
  ['login','register'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === tab);
    document.getElementById(`sec-${t}`).classList.toggle('active', t === tab);
  });
};

/* ── username check ── */
let uTimer;
window.checkUsername = function(val) {
  const inp   = document.getElementById('r-uname');
  const badge = document.getElementById('uname-badge');
  const hint  = document.getElementById('uname-hint');
  clearTimeout(uTimer);

  if (!val) {
    badge.textContent = '';
    inp.className = 'form-input uname-field';
    hint.className = 'hint';
    hint.textContent = 'رابطك: harpymenu.com/cards/profile.html?u=ahmed';
    return;
  }
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(val)) {
    badge.textContent = '✕'; badge.style.color = 'var(--error)';
    inp.className = 'form-input uname-field is-error';
    hint.className = 'hint error';
    hint.textContent = 'حروف إنجليزية وأرقام فقط، بدون مسافات (3-20 حرف)';
    return;
  }
  badge.textContent = '⏳'; badge.style.color = 'var(--muted)';
  hint.className = 'hint'; hint.textContent = 'جاري التحقق...';

  uTimer = setTimeout(async () => {
    try {
      const snap = await getDoc(doc(db, 'usernames', val.toLowerCase()));
      if (snap.exists()) {
        badge.textContent = '✕'; badge.style.color = 'var(--error)';
        inp.className = 'form-input uname-field is-error';
        hint.className = 'hint error'; hint.textContent = 'ال يوزرنيم ده مأخوذ، جرّب تاني';
      } else {
        badge.textContent = '✓'; badge.style.color = 'var(--success)';
        inp.className = 'form-input uname-field is-ok';
        hint.className = 'hint success';
        hint.textContent = `رابطك: harpymenu.com/cards/profile.html?u=${val.toLowerCase()}`;
      }
    } catch { hint.textContent = 'مش قادر يتحقق دلوقتي'; }
  }, 650);
};

/* ── password strength ── */
window.checkStrength = function(pw) {
  const bars = [document.getElementById('sb1'), document.getElementById('sb2'), document.getElementById('sb3')];
  bars.forEach(b => { b.className = 's-bar'; });
  let s = 0;
  if (pw.length >= 6)  s++;
  if (pw.length >= 10) s++;
  if (/[A-Z]/.test(pw) && /[0-9]/.test(pw)) s++;
  for (let i = 0; i < s; i++) bars[i].classList.add(`lvl-${s}`);
};

/* ── LOGIN ── */
window.doLogin = async function() {
  const email = document.getElementById('l-email').value.trim();
  const pass  = document.getElementById('l-pass').value;
  if (!email || !pass) { toast('ادخل الإيميل وكلمة المرور', 'error'); return; }
  setLoading('btn-login', true);
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    toast('مرحباً! 👋', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 900);
  } catch (e) {
    const msgs = {
      'auth/invalid-credential':   'البريد الإلكتروني أو كلمة المرور غير صحيحة',
      'auth/user-not-found':       'لا يوجد حساب بهذا البريد الإلكتروني',
      'auth/wrong-password':       'كلمة المرور غير صحيحة',
      'auth/invalid-email':        'البريد الإلكتروني غير صحيح',
      'auth/too-many-requests':    'محاولات كثيرة، يرجى المحاولة لاحقاً',
    };
    toast(msgs[e.code] || 'حدث خطأ أثناء تسجيل الدخول، يرجى المحاولة ثانية', 'error');
  } finally { setLoading('btn-login', false); }
};

/* ── REGISTER ── */
window.doRegister = async function() {
  const name  = document.getElementById('r-name').value.trim();
  const uname = document.getElementById('r-uname').value.trim().toLowerCase();
  const email = document.getElementById('r-email').value.trim();
  const pass  = document.getElementById('r-pass').value;
  const conf  = document.getElementById('r-conf').value;
  const code  = document.getElementById('r-code').value.trim().toUpperCase();

  if (!name || !uname || !email || !pass || !conf || !code) { toast('ادخل كل البيانات', 'error'); return; }
  if (!/^[a-zA-Z0-9_]{3,20}$/.test(uname)) { toast('اليوزرنيم غير صحيح', 'error'); return; }
  if (pass !== conf)  { toast('كلمة المرور غير متطابقة', 'error'); return; }
  if (pass.length < 6) { toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error'); return; }

  setLoading('btn-register', true);
  try {
    // 1. Verify activation code
    const codeSnap = await getDoc(doc(db, 'activationCodes', code));
    if (!codeSnap.exists()) {
      toast('كود التفعيل غير صحيح', 'error');
      setLoading('btn-register', false);
      return;
    }
    const codeData = codeSnap.data();
    if (codeData.isUsed === true) {
      toast('كود التفعيل مستخدم من قبل', 'error');
      setLoading('btn-register', false);
      return;
    }

    // 2. Verify username
    const taken = await getDoc(doc(db, 'usernames', uname));
    if (taken.exists()) { toast('اليوزرنيم مأخوذ بالفعل', 'error'); setLoading('btn-register', false); return; }

    // 3. Create auth user
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const uid  = cred.user.uid;

    // 4. Update activation code to used
    await updateDoc(doc(db, 'activationCodes', code), {
      isUsed: true,
      usedBy: uid,
      usedAt: new Date().toISOString()
    });

    // 5. Create user doc
    await setDoc(doc(db, 'users', uid), {
      uid, username:uname, name, email,
      photo:'', title:'', company:'', bio:'',
      mobile:'', whatsapp:'', publicEmail:'',
      location:'', website:'',
      instagram:'', linkedin:'', tiktok:'',
      twitter:'', snapchat:'', youtube:'',
      theme:'#7c3aed', lang:'ar',
      createdAt: new Date().toISOString()
    });
    await setDoc(doc(db, 'usernames', uname), { uid });

    toast('تم إنشاء الحساب بنجاح! 🎉', 'success');
    setTimeout(() => window.location.href = 'dashboard.html', 1000);
  } catch (e) {
    const msgs = {
      'auth/email-already-in-use': 'هذا البريد الإلكتروني مستخدم بالفعل',
      'auth/invalid-email':        'البريد الإلكتروني غير صحيح',
      'auth/weak-password':        'كلمة المرور ضعيفة جداً',
    };
    toast(msgs[e.code] || 'حدث خطأ أثناء التسجيل، يرجى المحاولة لاحقاً', 'error');
  } finally { setLoading('btn-register', false); }
};

/* ── Enter key ── */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const active = document.querySelector('.form-section.active');
  if (active.id === 'sec-login') doLogin(); else doRegister();
});
</script>
</body>
</html>
