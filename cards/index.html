<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HARPY CARDS — سجّل وابدأ</title>
  <meta name="description" content="بطاقة بيزنس رقمية ذكية — اضغط وشارك معلوماتك بـ NFC" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="manifest.json?v=3.0.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css?v=3.0.0" />
  <link rel="stylesheet" href="css/auth.css?v=3.0.0" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="grid-bg"></div>

<div class="wrapper">
  <div class="brand">
    <a class="brand-logo" href="#">
      <div class="brand-icon">
        <svg style="width:24px;height:24px;fill:none;stroke:white;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24">
          <rect width="20" height="14" x="2" y="5" rx="2"/>
          <line x1="2" x2="22" y1="10" y2="10"/>
        </svg>
      </div>
      <span class="brand-name">HARPY CARDS</span>
    </a>
    <p class="brand-tag">بطاقة بيزنس رقمية — اضغط وشارك</p>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab-btn active" id="tab-login">دخول</button>
      <button class="tab-btn"        id="tab-register">تسجيل</button>
    </div>

    <!-- ── LOGIN ── -->
    <div class="form-section active" id="sec-login">
      <div class="form-group">
        <label class="form-label" for="l-email">البريد الإلكتروني</label>
        <input type="email" id="l-email" class="form-input" placeholder="example@email.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label" for="l-pass">كلمة المرور</label>
        <input type="password" id="l-pass" class="form-input" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn-submit" id="btn-login">
        <span class="btn-txt">دخول</span>
        <div class="btn-spinner"></div>
      </button>
    </div>

    <!-- ── REGISTER ── -->
    <div class="form-section" id="sec-register">
      <div class="form-group">
        <label class="form-label" for="r-name">الاسم الكامل</label>
        <input type="text" id="r-name" class="form-input" placeholder="أحمد محمد" autocomplete="name" />
      </div>

      <div class="form-group">
        <label class="form-label" for="r-uname">اليوزرنيم (رابط بطاقتك)</label>
        <div class="uname-wrap">
          <input type="text" id="r-uname" class="form-input uname-field"
                 placeholder="ahmed" autocomplete="off" />
          <span class="uname-badge" id="uname-badge"></span>
        </div>
        <p class="hint" id="uname-hint">رابطك: harpymenu.com/cards/ahmed</p>
      </div>

      <div class="form-group">
        <label class="form-label" for="r-email">البريد الإلكتروني</label>
        <input type="email" id="r-email" class="form-input" placeholder="example@email.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label class="form-label" for="r-pass">كلمة المرور</label>
        <input type="password" id="r-pass" class="form-input" placeholder="••••••••"
               autocomplete="new-password" />
        <div class="strength-bars">
          <div class="s-bar" id="sb1"></div>
          <div class="s-bar" id="sb2"></div>
          <div class="s-bar" id="sb3"></div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="r-conf">تأكيد كلمة المرور</label>
        <input type="password" id="r-conf" class="form-input" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label class="form-label" for="r-code">كود التفعيل (Activation Code)</label>
        <input type="text" id="r-code" class="form-input" placeholder="HARPY-XXXX-XXXX" style="direction: ltr; text-align: left;" autocomplete="off" />
      </div>

      <button class="btn-submit" id="btn-register">
        <span class="btn-txt">إنشاء الحساب</span>
        <div class="btn-spinner"></div>
      </button>
    </div>
  </div>

  <p style="text-align:center;color:var(--dim);font-size:12px;margin-top:18px;">
    © 2025 HARPY CARDS — جميع الحقوق محفوظة
  </p>
</div>

<div id="toasts"></div>

<script type="module" src="js/auth-page.js?v=3.0.0"></script>
</body>
</html>
