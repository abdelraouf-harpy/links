<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HARPY CARDS</title>
  <meta name="description" content="بطاقة بيزنس رقمية" />
  <meta property="og:type"        content="profile" />
  <meta property="og:site_name"   content="HARPY CARDS" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --theme:      #7c3aed;
      --theme-r:    124;
      --theme-g:    58;
      --theme-b:    237;
      --bg:         #050510;
      --card:       rgba(255,255,255,0.04);
      --border:     rgba(255,255,255,0.09);
      --text:       #f1f5f9;
      --muted:      #94a3b8;
      --dim:        #64748b;
      --radius:     16px;
      --ease:       cubic-bezier(0.4,0,0.2,1);
    }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* --- LOADER --- */
    #loader {
      position: fixed; inset: 0; background: var(--bg); z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    .ld-ring {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,.08);
      border-top-color: var(--theme);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- 404 --- */
    #not-found {
      display: none; min-height: 100vh;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; text-align: center; padding: 24px;
    }
    #not-found .emoji { font-size: 72px; }
    #not-found h2 { font-size: 22px; font-weight: 700; }
    #not-found p  { color: var(--muted); font-size: 15px; max-width: 300px; }

    /* --- MAIN --- */
    #profile {
      display: none;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    /* ─── HERO ─── */
    .hero {
      position: relative; overflow: hidden;
      padding: 64px 24px 90px;
      text-align: center;
      background: linear-gradient(145deg, var(--theme) 0%, #1a0a2e 100%);
    }

    /* subtle dot pattern overlay */
    .hero::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .hero-orb {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.06); pointer-events: none;
    }
    .hero-orb-1 { width: 320px; height: 320px; top: -100px; right: -80px; }
    .hero-orb-2 { width: 220px; height: 220px; bottom: -70px; left: -50px; }

    /* photo */
    .photo-wrap { position: relative; display: inline-block; margin-bottom: 18px; }
    .photo-ring-anim {
      position: absolute; inset: -10px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.22);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1);    opacity: .5; }
      50%      { transform: scale(1.06); opacity: 1; }
    }
    .photo-circle {
      width: 112px; height: 112px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 50px; overflow: hidden; position: relative;
    }
    .photo-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }

    /* name / title */
    .hero-name    { font-size: 28px; font-weight: 900; color: #fff; position: relative; margin-bottom: 6px; }
    .hero-title   { font-size: 15px; color: rgba(255,255,255,.78); font-weight: 500; position: relative; }
    .hero-company { font-size: 13px; color: rgba(255,255,255,.5); margin-top: 4px; position: relative; }

    /* floating save button */
    .save-btn {
      position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
      background: white; color: var(--theme);
      border: none; border-radius: 50px;
      padding: 13px 30px; font-size: 14px; font-weight: 800;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
      transition: .25s var(--ease);
      display: flex; align-items: center; gap: 8px;
      font-family: inherit;
    }
    .save-btn:hover { transform: translateX(-50%) translateY(-3px); box-shadow: 0 16px 45px rgba(0,0,0,.45); }

    /* ─── CONTENT ─── */
    .content { padding: 46px 18px 0; }

    /* card wrapper */
    .c-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px; margin-bottom: 14px;
    }

    /* bio */
    .bio-text {
      font-size: 15px; color: var(--muted);
      line-height: 1.85; text-align: center;
    }

    /* actions grid */
    .actions { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .act-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 9px; padding: 16px 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); text-decoration: none; color: var(--text);
      transition: .25s var(--ease); cursor: pointer;
    }
    .act-btn:hover {
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.12);
      border-color: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.35);
      transform: translateY(-3px);
    }
    .act-icon {
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.16);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .act-lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; }

    /* info rows */
    .info-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; margin-bottom: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); text-decoration: none; color: var(--text);
      transition: .25s var(--ease);
    }
    .info-row:last-child { margin-bottom: 0; }
    .info-row:hover {
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.09);
      border-color: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.25);
    }
    .info-icon-box {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.15);
      display: flex; align-items: center; justify-content: center; font-size: 19px;
    }
    .info-content { flex: 1; min-width: 0; }
    .info-lbl  { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
    .info-val  { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-arr  { color: var(--dim); font-size: 13px; flex-shrink: 0; }

    /* social grid */
    .sec-label { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .socials { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .soc-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius);
      text-decoration: none; color: var(--text);
      font-size: 14px; font-weight: 600; transition: .25s var(--ease);
    }
    .soc-btn:hover {
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.1);
      border-color: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.3);
      transform: translateY(-2px);
    }
    .soc-icon { font-size: 20px; flex-shrink: 0; }

    /* powered by */
    .powered {
      text-align: center; padding: 28px 16px;
      font-size: 13px; color: var(--dim);
    }
    .powered a { color: var(--theme); text-decoration: none; font-weight: 700; }

    /* ─── ANIMATIONS ─── */
    .fade-up { animation: fadeUp .55s var(--ease) both; }
    .d1 { animation-delay: .10s; }
    .d2 { animation-delay: .20s; }
    .d3 { animation-delay: .30s; }
    .d4 { animation-delay: .40s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* RTL arrow flip */
    [dir="ltr"] .info-arr { transform: scaleX(-1); }
    
    .svg-icon {
      width: 1.25rem;
      height: 1.25rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      display: inline-block;
      vertical-align: middle;
    }
    
    .svg-icon-fill {
      width: 1.25rem;
      height: 1.25rem;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
  <div class="ld-ring"></div>
  <p style="color:var(--dim);font-size:14px">جاري التحميل...</p>
</div>

<!-- 404 -->
<div id="not-found">
  <div class="emoji">
    <svg style="width: 64px; height: 64px; fill: none; stroke: var(--dim); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; margin: 0 auto 16px;" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
      <line x1="9" x2="9.01" y1="9" y2="9"/>
      <line x1="15" x2="15.01" y1="9" y2="9"/>
    </svg>
  </div>
  <h2>الكارت غير موجود</h2>
  <p>تأكد من الرابط أو تواصل مع صاحب الكارت</p>
</div>

<!-- PROFILE -->
<div id="profile">

  <!-- ── HERO ── -->
  <div class="hero" id="hero">
    <div class="hero-orb hero-orb-1"></div>
    <div class="hero-orb hero-orb-2"></div>

    <div class="photo-wrap">
      <div class="photo-circle" id="photo-el">
        <svg style="width:48px;height:48px;stroke:rgba(255,255,255,.5);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="photo-ring-anim"></div>
    </div>

    <h1 class="hero-name"    id="h-name">—</h1>
    <p  class="hero-title"   id="h-title"  style="display:none"></p>
    <p  class="hero-company" id="h-company" style="display:none"></p>

    <button class="save-btn" id="save-contact-btn" onclick="downloadVCard()">
      <svg style="width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span id="save-lbl">حفظ في جهات الاتصال</span>
    </button>
  </div>

  <!-- ── CONTENT ── -->
  <div class="content">

    <!-- Bio -->
    <div class="c-card fade-up" id="bio-card" style="display:none">
      <p class="bio-text" id="bio-text"></p>
    </div>

    <!-- Action buttons -->
    <div class="c-card fade-up d1">
      <div class="actions" id="actions-grid"></div>
    </div>

    <!-- Info rows (location, website) -->
    <div id="info-rows" class="fade-up d2"></div>

    <!-- Social media -->
    <div class="c-card fade-up d3" id="social-card" style="display:none">
      <p class="sec-label" id="social-label">تابعني على</p>
      <div class="socials" id="social-grid"></div>
    </div>

    <!-- Powered by -->
    <div class="powered fade-up d4">
      بطاقة رقمية مدعومة من <a href="https://harpymenu.com/cards" target="_blank">HARPY CARDS</a>
    </div>
  </div>
</div>

<!-- ─── SCRIPT ─── -->
<script type="module">
import { db } from "./js/firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let profileData = null;

/* ── helpers ── */
function hexToRgb(hex) {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? { r: parseInt(r[1],16), g: parseInt(r[2],16), b: parseInt(r[3],16) } : { r:124, g:58, b:237 };
}
function darken(hex, pct = 0.45) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${Math.floor(r*(1-pct))},${Math.floor(g*(1-pct))},${Math.floor(b*(1-pct))})`;
}
function lighter(hex, pct = 0.25) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${Math.min(255,Math.floor(r+(255-r)*pct))},${Math.min(255,Math.floor(g+(255-g)*pct))},${Math.min(255,Math.floor(b+(255-b)*pct))})`;
}

/* ── load ── */
async function load() {
  const params = new URLSearchParams(window.location.search);
  const uname  = params.get('u');
  if (!uname) { show404(); return; }

  try {
    const uSnap = await getDoc(doc(db, 'usernames', uname.toLowerCase()));
    if (!uSnap.exists()) { show404(); return; }

    const uid   = uSnap.data().uid;
    const uDoc  = await getDoc(doc(db, 'users', uid));
    if (!uDoc.exists()) { show404(); return; }

    profileData = uDoc.data();
    render(profileData);
  } catch (e) {
    console.error(e);
    show404();
  }
}

function show404() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('not-found').style.display = 'flex';
}
function showProfile() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('profile').style.display = 'block';
}

/* ── render ── */
function render(d) {
  const isAr = d.lang !== 'en';
  const dir  = isAr ? 'rtl' : 'ltr';

  /* direction */
  document.documentElement.lang = isAr ? 'ar' : 'en';
  document.documentElement.dir  = dir;

  /* theme colors */
  const themeHex = d.theme || '#7c3aed';
  const rgb      = hexToRgb(themeHex);
  const root     = document.documentElement.style;
  root.setProperty('--theme',   themeHex);
  root.setProperty('--theme-r', rgb.r);
  root.setProperty('--theme-g', rgb.g);
  root.setProperty('--theme-b', rgb.b);

  /* hero gradient */
  const dark = darken(themeHex, 0.5);
  document.getElementById('hero').style.background =
    `linear-gradient(145deg, ${lighter(themeHex, .1)} 0%, ${dark} 100%)`;

  /* page meta */
  document.title = `${d.name || 'HARPY CARDS'} — HARPY CARDS`;
  setMeta('og:title',       d.name || 'HARPY CARDS');
  setMeta('og:description', d.bio  || `بطاقة بيزنس رقمية`);
  if (d.photo) setMeta('og:image', d.photo);

  /* photo */
  if (d.photo) {
    document.getElementById('photo-el').innerHTML =
      `<img src="${d.photo}" alt="${d.name}" style="width:112px;height:112px;border-radius:50%;object-fit:cover;" />`;
  }

  /* name */
  document.getElementById('h-name').textContent = d.name || '—';
  if (d.title)   { const el = document.getElementById('h-title');   el.textContent = d.title;   el.style.display='block'; }
  if (d.company) { const el = document.getElementById('h-company'); el.textContent = d.company; el.style.display='block'; }

  /* save contact label */
  document.getElementById('save-lbl').textContent = isAr ? 'حفظ في جهات الاتصال' : 'Save Contact';

  /* bio */
  if (d.bio) {
    document.getElementById('bio-card').style.display = 'block';
    document.getElementById('bio-text').textContent   = d.bio;
  }

  /* action buttons */
  const acts = [];
  if (d.mobile)      acts.push({ href:`tel:${d.mobile}`,                                    icon:`<svg class="svg-icon" style="stroke:currentColor;fill:none;width:22px;height:22px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`, lbl: isAr ? 'اتصال'   : 'Call'    });
  if (d.whatsapp) {
    let waNum = d.whatsapp.replace(/\D/g,'');
    if (waNum.startsWith('0') && waNum.length === 11) {
      waNum = '20' + waNum.substring(1);
    }
    acts.push({ href:`https://wa.me/${waNum}`,      icon:`<svg class="svg-icon-fill" style="fill:currentColor;width:22px;height:22px;" viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2zm.01 1.67c4.55 0 8.25 3.7 8.25 8.26 0 2.2-.86 4.28-2.42 5.84l-.41.41 1.43 5.24-5.37-1.41-.42.25c-1.44.86-3.09 1.31-4.78 1.31-4.55 0-8.25-3.7-8.25-8.26 0-2.2.86-4.28 2.42-5.84a8.204 8.204 0 0 1 5.82-2.42v-.03zm-1.89 3.11c-.26 0-.51.06-.72.27-.3.3-.87.87-.87 2.12 0 1.25.91 2.46 1.04 2.63.13.17 1.79 2.73 4.33 3.83.6.26 1.07.42 1.44.54.61.19 1.16.16 1.59.1.48-.07 1.48-.61 1.69-1.19.21-.58.21-1.07.15-1.19-.06-.12-.24-.18-.51-.31-.27-.13-1.59-.79-1.84-.87-.25-.09-.44-.13-.62.15-.18.27-.7 1.02-.85 1.19-.15.17-.3.19-.57.06-.27-.13-1.14-.42-2.18-1.35-.8-.71-1.34-1.6-1.5-1.87-.16-.27-.02-.42.12-.55.12-.12.27-.31.4-.47.13-.16.18-.27.27-.45.09-.18.04-.34-.02-.47-.06-.13-.62-1.5-.85-2.05-.23-.55-.46-.48-.62-.48z"/></svg>`, lbl: 'WhatsApp',                    target:'_blank' });
  }
  if (d.publicEmail) acts.push({ href:`mailto:${d.publicEmail}`,                            icon:`<svg class="svg-icon" style="stroke:currentColor;fill:none;width:22px;height:22px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`, lbl: isAr ? 'إيميل'   : 'Email'   });

  const grid = document.getElementById('actions-grid');
  if (acts.length) {
    grid.innerHTML = acts.map(a =>
      `<a href="${a.href}" class="act-btn" ${a.target?`target="${a.target}"`:''}>`+
        `<div class="act-icon">${a.icon}</div>`+
        `<span class="act-lbl">${a.lbl}</span>`+
      `</a>`
    ).join('');
  } else {
    grid.parentElement.style.display = 'none';
  }

  /* info rows */
  const infoRows = [];
  if (d.location) infoRows.push({
    href:  `https://maps.google.com?q=${encodeURIComponent(d.location)}`,
    icon: `<svg class="svg-icon" style="stroke:currentColor;fill:none;width:20px;height:20px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`, lbl: isAr ? 'الموقع' : 'Location', val: d.location, target:'_blank'
  });
  if (d.website) {
    const clean = d.website.replace(/^https?:\/\//,'');
    const href  = d.website.startsWith('http') ? d.website : `https://${d.website}`;
    infoRows.push({ href, icon:`<svg class="svg-icon" style="stroke:currentColor;fill:none;width:20px;height:20px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`, lbl: isAr ? 'الموقع الإلكتروني' : 'Website', val: clean, target:'_blank' });
  }

  document.getElementById('info-rows').innerHTML = infoRows.map(r =>
    `<a href="${r.href}" class="info-row" ${r.target?`target="${r.target}"`:''}>`+
      `<div class="info-icon-box">${r.icon}</div>`+
      `<div class="info-content">`+
        `<div class="info-lbl">${r.lbl}</div>`+
        `<div class="info-val">${r.val}</div>`+
      `</div>`+
      `<span class="info-arr">←</span>`+
    `</a>`
  ).join('');

  /* social */
  const platforms = [

function setMeta(property, content) {
  let el = document.querySelector(`meta[property="${property}"]`);
  if (!el) { el = document.createElement('meta'); el.setAttribute('property', property); document.head.appendChild(el); }
  el.setAttribute('content', content);
}

/* ── vCard download ── */
window.downloadVCard = function() {
  if (!profileData) return;
  const d = profileData;
  const lines = [
    'BEGIN:VCARD', 'VERSION:3.0',
    `FN:${d.name || ''}`,
    d.title   ? `TITLE:${d.title}`   : '',
    d.company ? `ORG:${d.company}`   : '',
    d.mobile  ? `TEL;TYPE=CELL:${d.mobile}` : '',
    d.publicEmail ? `EMAIL:${d.publicEmail}` : '',
    d.website ? `URL:${d.website}`   : '',
    d.location ? `ADR:;;${d.location};;;;` : '',
    d.photo ? `PHOTO;VALUE=URI:${d.photo}` : '',
    d.bio   ? `NOTE:${d.bio}`  : '',
    'END:VCARD'
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([lines], { type:'text/vcard;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `${d.name || 'contact'}.vcf`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
};
