  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --theme:      #7c3aed;
      --theme-r:    124;
      --theme-g:    58;
      --theme-b:    237;
      --bg:         #050510;
      --card:       rgba(255,255,255,0.04);
      --border:     rgba(255,255,255,0.09);
      --text:       #f1f5f9;
      --muted:      #94a3b8;
      --dim:        #64748b;
      --radius:     16px;
      --ease:       cubic-bezier(0.4,0,0.2,1);
    }

    body {
      font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* â•â•â• LOADER â•â•â• */
    #loader {
      position: fixed; inset: 0; background: var(--bg); z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    .ld-ring {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,.08);
      border-top-color: var(--theme);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* â•â•â• 404 â•â•â• */
    #not-found {
      display: none; min-height: 100vh;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; text-align: center; padding: 24px;
    }
    #not-found .emoji { font-size: 72px; }
    #not-found h2 { font-size: 22px; font-weight: 700; }
    #not-found p  { color: var(--muted); font-size: 15px; max-width: 300px; }

    /* â•â•â• MAIN â•â•â• */
    #profile {
      display: none;
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 48px;
    }

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• HERO â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    .hero {
      position: relative; overflow: hidden;
      padding: 64px 24px 90px;
      text-align: center;
      /* gradient is set dynamically by JS */
      background: linear-gradient(145deg, var(--theme) 0%, #1a0a2e 100%);
    }

    /* subtle dot pattern overlay */
    .hero::before {
      content: '';
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .hero-orb {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.06); pointer-events: none;
    }
    .hero-orb-1 { width: 320px; height: 320px; top: -100px; right: -80px; }
    .hero-orb-2 { width: 220px; height: 220px; bottom: -70px; left: -50px; }

    /* photo */
    .photo-wrap { position: relative; display: inline-block; margin-bottom: 18px; }
    .photo-ring-anim {
      position: absolute; inset: -10px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.22);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1);    opacity: .5; }
      50%      { transform: scale(1.06); opacity: 1; }
    }
    .photo-circle {
      width: 112px; height: 112px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      display: flex; align-items: center; justify-content: center;
      font-size: 50px; overflow: hidden; position: relative;

    .photo-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }

    /* name / title */
    .hero-name    { font-size: 28px; font-weight: 900; color: #fff; position: relative; margin-bottom: 6px; }
    .hero-title   { font-size: 15px; color: rgba(255,255,255,.78); font-weight: 500; position: relative; }
    .hero-company { font-size: 13px; color: rgba(255,255,255,.5); margin-top: 4px; position: relative; }

    /* floating save button */
    .save-btn {
      position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);

    .save-btn:hover { transform: translateX(-50%) translateY(-3px); box-shadow: 0 16px 45px rgba(0,0,0,.45); }

    /* card wrapper */

    /* bio */

    /* actions grid */
    .actions { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
    .act-btn {
      display: flex; flex-direction: column; align-items: center;
      gap: 9px; padding: 16px 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); text-decoration: none; color: var(--text);
      transition: .25s var(--ease); cursor: pointer;
    }
    .act-btn:hover {
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.12);
      border-color: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.35);
      transform: translateY(-3px);
    }
    .act-icon {
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.16);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .act-lbl { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; }

    /* info rows */
    .info-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; margin-bottom: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); text-decoration: none; color: var(--text);
      transition: .25s var(--ease);
    }
    .info-row:last-child { margin-bottom: 0; }
    .info-row:hover {
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.09);
      border-color: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.25);
    }
    .info-icon-box {
      width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.15);
      display: flex; align-items: center; justify-content: center; font-size: 19px;
    }
    .info-content { flex: 1; min-width: 0; }
    .info-lbl  { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
    .info-val  { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-arr  { color: var(--dim); font-size: 13px; flex-shrink: 0; }

    /* social grid */
    .sec-label { font-size: 11px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .socials { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .soc-btn {

      padding: 13px 14px; background: var(--card);
      border: 1px solid var(--border); border-radius: var(--radius);
      text-decoration: none; color: var(--text);
      font-size: 14px; font-weight: 600; transition: .25s var(--ease);
    }
    .soc-btn:hover {
      background: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.1);
      border-color: rgba(var(--theme-r),var(--theme-g),var(--theme-b),.3);
      transform: translateY(-2px);
    }
    .soc-icon { font-size: 20px; flex-shrink: 0; }

    /* powered by */
    .powered {

    /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• ANIMATIONS â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
    .fade-up { animation: fadeUp .55s var(--ease) both; }

    .d2 { animation-delay: .20s; }
    .d3 { animation-delay: .30s; }
    .d4 { animation-delay: .40s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* RTL arrow flip */
    [dir="ltr"] .info-arr { transform: scaleX(-1); }
  </style>

<!-- â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• SCRIPT â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• -->
<script type="module">
import { db } from "./js/firebase-config.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// âš ï¸ Ø¶Ø¹ Firebase config Ø§Ù„Ø®Ø§Øµ Ø¨Ùƒ Ù‡Ù†Ø§




let profileData = null;

/* â”€â”€ helpers â”€â”€ */
function hexToRgb(hex) {
  const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return r ? { r: parseInt(r[1],16), g: parseInt(r[2],16), b: parseInt(r[3],16) } : { r:124, g:58, b:237 };
}
function darken(hex, pct = 0.45) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${Math.floor(r*(1-pct))},${Math.floor(g*(1-pct))},${Math.floor(b*(1-pct))})`;
}
function lighter(hex, pct = 0.25) {
  const { r, g, b } = hexToRgb(hex);
  return `rgb(${Math.min(255,Math.floor(r+(255-r)*pct))},${Math.min(255,Math.floor(g+(255-g)*pct))},${Math.min(255,Math.floor(b+(255-b)*pct))})`;
}

/* â”€â”€ load â”€â”€ */
async function load() {
  const params = new URLSearchParams(window.location.search);
  const uname  = params.get('u');
  if (!uname) { show404(); return; }

  try {
    const uSnap = await getDoc(doc(db, 'usernames', uname.toLowerCase()));
    if (!uSnap.exists()) { show404(); return; }

    const uid   = uSnap.data().uid;
    const uDoc  = await getDoc(doc(db, 'users', uid));
    if (!uDoc.exists()) { show404(); return; }

    profileData = uDoc.data();
    render(profileData);
  } catch (e) {
    console.error(e);
    show404();
  }
}

function show404() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('not-found').style.display = 'flex';
}
function showProfile() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('profile').style.display = 'block';
}

/* â”€â”€ render â”€â”€ */
function render(d) {
  const isAr = d.lang !== 'en';
  const dir  = isAr ? 'rtl' : 'ltr';

  /* direction */
  document.documentElement.lang = isAr ? 'ar' : 'en';
  document.documentElement.dir  = dir;

  /* theme colors */
  const themeHex = d.theme || '#7c3aed';
  const rgb      = hexToRgb(themeHex);
  const root     = document.documentElement.style;
  root.setProperty('--theme',   themeHex);
  root.setProperty('--theme-r', rgb.r);
  root.setProperty('--theme-g', rgb.g);
  root.setProperty('--theme-b', rgb.b);

  /* hero gradient */
  const dark = darken(themeHex, 0.5);
  document.getElementById('hero').style.background =
    `linear-gradient(145deg, ${lighter(themeHex, .1)} 0%, ${dark} 100%)`;

  /* page meta */
  document.title = `${d.name || 'HARPY CARDS'} â€” HARPY CARDS`;
  setMeta('og:title',       d.name || 'HARPY CARDS');
  setMeta('og:description', d.bio  || `Ø¨Ø·Ø§Ù‚Ø© Ø¨ÙŠØ²Ù†Ø³ Ø±Ù‚Ù…ÙŠØ©`);
  if (d.photo) setMeta('og:image', d.photo);

  /* photo */
  if (d.photo) {
    document.getElementById('photo-el').innerHTML =
      `<img src="${d.photo}" alt="${d.name}" style="width:112px;height:112px;border-radius:50%;object-fit:cover;" />`;
  }

  /* name */
  document.getElementById('h-name').textContent = d.name || 'â€”';
  if (d.title)   { const el = document.getElementById('h-title');   el.textContent = d.title;   el.style.display='block'; }
  if (d.company) { const el = document.getElementById('h-company'); el.textContent = d.company; el.style.display='block'; }

  /* save contact label */
  document.getElementById('save-lbl').textContent = isAr ? 'Ø­ÙØ¸ ÙÙŠ Ø¬Ù‡Ø§Øª Ø§Ù„Ø§ØªØµØ§Ù„' : 'Save Contact';

  /* bio */
  if (d.bio) {
    document.getElementById('bio-card').style.display = 'block';
    document.getElementById('bio-text').textContent   = d.bio;
  }

  /* action buttons */
  const acts = [];
  if (d.mobile)      acts.push({ href:`tel:${d.mobile}`,                                    icon:'ðŸ“ž', lbl: isAr ? 'Ø§ØªØµØ§Ù„'   : 'Call'    });
  if (d.whatsapp)    acts.push({ href:`https://wa.me/${d.whatsapp.replace(/\D/g,'')}`,      icon:'ðŸ’¬', lbl: 'WhatsApp',                    target:'_blank' });
  if (d.publicEmail) acts.push({ href:`mailto:${d.publicEmail}`,                            icon:'âœ‰ï¸', lbl: isAr ? 'Ø¥ÙŠÙ…ÙŠÙ„'   : 'Email'   });

  const grid = document.getElementById('actions-grid');
  if (acts.length) {
    grid.innerHTML = acts.map(a =>
      `<a href="${a.href}" class="act-btn" ${a.target?`target="${a.target}"`:''}>`+
        `<div class="act-icon">${a.icon}</div>`+
        `<span class="act-lbl">${a.lbl}</span>`+
      `</a>`
    ).join('');
  } else {
    grid.parentElement.style.display = 'none';
  }

  /* info rows */
  const infoRows = [];
  if (d.location) infoRows.push({
    href:  `https://maps.google.com?q=${encodeURIComponent(d.location)}`,
    icon: 'ðŸ“', lbl: isAr ? 'Ø§Ù„Ù…ÙˆÙ‚Ø¹' : 'Location', val: d.location, target:'_blank'
  });
  if (d.website) {
    const clean = d.website.replace(/^https?:\/\//,'');
    const href  = d.website.startsWith('http') ? d.website : `https://${d.website}`;
    infoRows.push({ href, icon:'ðŸŒ', lbl: isAr ? 'Ø§Ù„Ù…ÙˆÙ‚Ø¹ Ø§Ù„Ø¥Ù„ÙƒØªØ±ÙˆÙ†ÙŠ' : 'Website', val: clean, target:'_blank' });
  }

  document.getElementById('info-rows').innerHTML = infoRows.map(r =>
    `<a href="${r.href}" class="info-row" ${r.target?`target="${r.target}"`:''}>`+
      `<div class="info-icon-box">${r.icon}</div>`+
      `<div class="info-content">`+
        `<div class="info-lbl">${r.lbl}</div>`+
        `<div class="info-val">${r.val}</div>`+
      `</div>`+
      `<span class="info-arr">â†</span>`+
    `</a>`
  ).join('');

  /* social */
  const platforms = [
    { key:'instagram', icon:'ðŸ“¸', label:'Instagram' },
    { key:'linkedin',  icon:'ðŸ’¼', label:'LinkedIn'  },
    { key:'tiktok',    icon:'ðŸŽµ', label:'TikTok'    },
    { key:'twitter',   icon:'ðŸ¦', label:'X / Twitter' },
    { key:'snapchat',  icon:'ðŸ‘»', label:'Snapchat'  },
    { key:'youtube',   icon:'â–¶ï¸', label:'YouTube'   },
  ];
  const active = platforms.filter(p => d[p.key]);
  if (active.length) {
    document.getElementById('social-card').style.display = 'block';
    document.getElementById('social-label').textContent  = isAr ? 'ØªØ§Ø¨Ø¹Ù†ÙŠ Ø¹Ù„Ù‰' : 'Follow Me';
    document.getElementById('social-grid').innerHTML = active.map(p =>
      `<a href="${d[p.key]}" class="soc-btn" target="_blank" rel="noopener">`+
        `<span class="soc-icon">${p.icon}</span>`+
        `<span>${p.label}</span>`+
      `</a>`
    ).join('');
  }

  showProfile();
}

function setMeta(property, content) {
  let el = document.querySelector(`meta[property="${property}"]`);
  if (!el) { el = document.createElement('meta'); el.setAttribute('property', property); document.head.appendChild(el); }
  el.setAttribute('content', content);
}

/* â”€â”€ vCard download â”€â”€ */
window.downloadVCard = function() {
  if (!profileData) return;
  const d = profileData;
  const lines = [
    'BEGIN:VCARD', 'VERSION:3.0',
    `FN:${d.name || ''}`,
    d.title   ? `TITLE:${d.title}`   : '',
    d.company ? `ORG:${d.company}`   : '',
    d.mobile  ? `TEL;TYPE=CELL:${d.mobile}` : '',
    d.publicEmail ? `EMAIL:${d.publicEmail}` : '',
    d.website ? `URL:${d.website}`   : '',
    d.location ? `ADR:;;${d.location};;;;` : '',
    d.photo ? `PHOTO;MEDIATYPE=image/jpeg:${d.photo}` : '',
    d.bio   ? `NOTE:${d.bio}`  : '',
    'END:VCARD'
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([lines], { type:'text/vcard;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = `${d.name || 'contact'}.vcf`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
};

load();
</script>
