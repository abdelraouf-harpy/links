<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HARPY CARDS</title>
  <meta name="description" content="بطاقة بيزنس رقمية" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="manifest.json?v=3.0.0" />
  <meta property="og:type"        content="profile" />
  <meta property="og:site_name"   content="HARPY CARDS" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/common.css?v=3.2.0" />
  <link rel="stylesheet" href="css/profile.css?v=3.2.0" />
</head>
<body>

<!-- Background Glowing Orbs -->
<div class="bg-glow-orbs">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
</div>

<!-- LOADER -->
<div id="loader">
  <div class="loader-ring"></div>
  <p style="color:var(--dim);font-size:14px">جاري التحميل...</p>
</div>

<!-- 404 -->
<div id="not-found">
  <div class="emoji">
    <svg style="width: 64px; height: 64px; fill: none; stroke: var(--dim); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; margin: 0 auto 16px;" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
      <line x1="9" x2="9.01" y1="9" y2="9"/>
      <line x1="15" x2="15.01" y1="9" y2="9"/>
    </svg>
  </div>
  <h2>الكارت غير موجود</h2>
  <p>تأكد من الرابط أو تواصل مع صاحب الكارت</p>
</div>

<!-- PROFILE -->
<div id="profile">

  <!-- ── HERO (Cinematic Cover) ── -->
  <div class="hero" id="hero">
    <div class="hero-bg">
      <div class="hero-orb hero-orb-1"></div>
      <div class="hero-orb hero-orb-2"></div>
    </div>

    <div class="cover-wrap">
      <div class="cover-img-el" id="photo-el">
        <svg class="default-avatar-svg" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="cover-overlay"></div>
    </div>

    <div class="hero-text-wrap">
      <h1 class="hero-name"    id="h-name">—</h1>
      <p  class="hero-title"   id="h-title"  style="display:none"></p>
      <p  class="hero-company" id="h-company" style="display:none"></p>
    </div>

    <button class="save-btn" id="save-contact-btn">
      <svg style="width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle;" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span id="save-lbl">حفظ في جهات الاتصال</span>
    </button>
  </div>

  <!-- ── CONTENT ── -->
  <div class="content">

    <!-- Bio -->
    <div class="c-card fade-up" id="bio-card" style="display:none">
      <p class="bio-text" id="bio-text"></p>
    </div>

    <!-- Action buttons -->
    <div class="c-card fade-up d1">
      <div class="actions" id="actions-grid"></div>
    </div>

    <!-- Info rows (location, website) -->
    <div id="info-rows" class="fade-up d2"></div>

    <!-- Social media -->
    <div class="c-card fade-up d3" id="social-card" style="display:none">
      <p class="sec-label" id="social-label">تابعني على</p>
      <div class="socials" id="social-grid"></div>
    </div>

  </div>
</div>

<!-- Powered by (Separate Global Viewport Footer) -->
<div class="powered fade-up d4">
  تصميم وتطوير بواسطة <a href="https://harpymenu.com" target="_blank">HARPY</a>
</div>

<!-- ─── SCRIPT ─── -->
<script type="module" src="js/profile-page.js?v=3.2.0"></script>
</body>
</html>
