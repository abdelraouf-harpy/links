<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 110" width="100%" height="100%">
  <defs>
    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Symbol -->
  <g transform="translate(20, 15)">
    <!-- Cloche Base -->
    <path d="M 15 65 A 35 35 0 0 1 85 65 Z" fill="url(#orderGrad)" />
    <!-- Cloche Knob -->
    <circle cx="50" cy="24" r="6" fill="#f97316" />
    <rect x="47" y="27" width="6" height="5" rx="2" fill="#ea580c" />
    <!-- Under Plate Line -->
    <rect x="10" y="68" width="80" height="6" rx="3" fill="#f97316" />
    <!-- Plate Steam / Digital Wave -->
    <path d="M 38 18 Q 42 10 38 4" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 50 16 Q 54 8 50 2" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 62 18 Q 66 10 62 4" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Small QR hint inside dome -->
    <rect x="42" y="44" width="6" height="6" fill="#ffffff" rx="1"/>
    <rect x="52" y="44" width="6" height="6" fill="#ffffff" rx="1"/>
    <rect x="47" y="52" width="6" height="6" fill="#ffffff" rx="1"/>
  </g>

  <!-- Brand Typography -->
  <!-- 'Order' in sleek modern font -->
  <text x="125" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-1">
    Order
  </text>
  <!-- Accent Dot -->
  <circle cx="268" cy="63" r="5.5" fill="url(#orderGrad)" filter="url(#glow)" />
  
  <!-- Subtitle Tagline -->
  <text x="128" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Cairo', sans-serif" font-weight="600" font-size="13" fill="#9ca3af" letter-spacing="3">
    SMART DIGITAL MENU
  </text>
</svg>
