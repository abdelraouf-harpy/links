<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنيو الإلكتروني الذكي — قائمة الطعام</title>
  <meta name="description" content="قائمة طعام رقمية تفاعلية بالباركود، اطلب وجبتك المفضلة أونلاين مباشرة عبر واتساب.">
  <meta property="og:type" content="restaurant.menu">
  <meta property="og:site_name" content="Harpy Order">
  <meta property="og:title" content="المنيو الإلكتروني الذكي — قائمة الطعام">
  <meta property="og:description" content="قائمة طعام رقمية تفاعلية بالباركود، اطلب وجبتك المفضلة أونلاين مباشرة عبر واتساب.">
  <meta property="og:image" content="https://harpymenu.com/assets/brand/og_banner.png">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #120e0c;
      color: #faf6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(234, 88, 12, 0.2);
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      var TENANT_REGISTRY = {
        'king': { name: 'مطعم كينج', logo: 'https://res.cloudinary.com/pq2pimug/image/upload/v1794005707/fekgebaclepbe4hmt4ga.jpg', desc: 'أشهى المشويات، البرجر الفاخر، والبيتزا الإيطالية على أصولها' },
        'saj': { name: 'مطعم صــاج', logo: 'https://iili.io/n3HVHX4.jpg', desc: 'أصل البيتزا والكريبات والحواوشي والسوري في سوهاج الجديدة' },
        'aloo': { name: 'Aloo Burger', logo: 'https://res.cloudinary.com/pq2pimug/image/upload/v1793879648/ycssznrc2i1rf8abpyu2.jpg', desc: 'أشهى ساندوتشات البرجر والوجبات السريعة على أصولها' },
        'bazzes': { name: 'مطعم بازيز', logo: 'https://harpymenu.com/assets/icons/order-icon-512.png', desc: 'قائمة طعام مطعم بازيز أونلاين' },
        'sasa': { name: 'مطعم ساسا', logo: 'https://harpymenu.com/assets/icons/order-icon-512.png', desc: 'قائمة طعام مطعم ساسا أونلاين' }
      };

      function updateTenantMeta(slug, isAdmin) {
        try {
          var t = TENANT_REGISTRY[slug] || {};
          var name = t.name || slug;
          var logo = t.logo || 'https://harpymenu.com/assets/brand/og_banner.png';
          var desc = t.desc || (isAdmin ? ('لوحة التحكم السحابية لمطعم ' + name) : ('قائمة طعام ' + name + ' والطلب أونلاين'));
          var title = isAdmin ? ('لوحة إدارة ' + name + ' — Harpy Admin') : ('منيو ' + name + ' — قائمة الطعام والطلبات');
          document.title = title;
          var mTitle = document.querySelector('meta[property="og:title"]');
          if (mTitle) mTitle.content = title;
          var mDesc = document.querySelector('meta[property="og:description"]');
          if (mDesc) mDesc.content = desc;
          var mImg = document.querySelector('meta[property="og:image"]');
          if (mImg) mImg.content = logo;
        } catch(e) {}
      }

      try {
        var path = window.location.pathname || '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var segments = path.split('/').filter(Boolean);

        // Detect GitHub Pages repo subfolder (e.g. /links/)
        var repoPrefix = '';
        if (window.location.hostname.includes('github.io') && segments.length > 0) {
          var first = segments[0].toLowerCase();
          var standardPages = ['order.html', 'admin.html', 'index.html', 'portfolio.html', '404.html', 'products.html', 'sw.js', 'manifest.json'];
          if (!standardPages.includes(first) && !first.endsWith('.html') && !first.endsWith('.json')) {
            repoPrefix = '/' + segments[0];
            segments.shift(); // Remove repo name from routing segments!
          }
        }

        // Check legacy restaurant-specific files (e.g. saj.html, king.html, saj-admin.html, manifests)
        for (var i = 0; i < segments.length; i++) {
          var seg = segments[i].toLowerCase();
          if (seg.indexOf('admin-manifest-') !== -1) {
            var mSlug = seg.replace(/admin-manifest-([^.]+)\.json/, '$1');
            window.location.replace(repoPrefix + '/admin-manifest.json?m=' + encodeURIComponent(mSlug));
            return;
          }
          if (seg.indexOf('manifest-') !== -1) {
            var mSlug = seg.replace(/manifest-([^.]+)\.json/, '$1');
            window.location.replace(repoPrefix + '/manifest.json?m=' + encodeURIComponent(mSlug));
            return;
          }
          if (seg.endsWith('-admin.html') || seg.startsWith('admin-')) {
            var rSlug = seg.replace('-admin.html', '').replace('admin-', '').replace('.html', '');
            if (rSlug) {
              window.location.replace(repoPrefix + '/admin.html?m=' + encodeURIComponent(rSlug) + (search ? ('&' + search.slice(1)) : '') + hash);
              return;
            }
          }
          if (seg.endsWith('.html') && seg !== 'index.html' && seg !== 'order.html' && seg !== 'admin.html' && seg !== 'portfolio.html' && seg !== '404.html') {
            var rSlug = seg.replace('.html', '');
            if (rSlug) {
              window.location.replace(repoPrefix + '/order.html?m=' + encodeURIComponent(rSlug) + (search ? ('&' + search.slice(1)) : '') + hash);
              return;
            }
          }
        }

        // Check if landing with an admin tab hash (#orders, #products, #categories, etc.)
        var adminHashes = ['orders', 'products', 'categories', 'stories', 'settings', 'backup', 'pos'];
        var cleanHash = hash.replace('#', '').trim();
        var storedSlug = '';
        try {
          storedSlug = localStorage.getItem('harpy_admin_active_slug') || 
                       localStorage.getItem('harpy_active_slug') || 
                       localStorage.getItem('harpy_customer_installed_slug') || 
                       localStorage.getItem('harpy_last_visited_slug') || '';
        } catch(e) {}

        if (adminHashes.indexOf(cleanHash) !== -1) {
          var slug = storedSlug || 'king';
          window.location.replace(repoPrefix + '/admin.html?m=' + encodeURIComponent(slug) + '#' + cleanHash);
          return;
        }
        
        // If asking for admin (/admin, /admin/, /admin?m=slug)
        if (segments.indexOf('admin') !== -1 || path.indexOf('/admin') !== -1) {
          var remaining = segments.filter(function(s) { return s !== 'admin' && s !== 'order' && !s.endsWith('.html'); });
          var slug = remaining.length > 0 ? remaining[0] : '';
          var params = new URLSearchParams(search);
          if (slug && !params.get('m')) params.set('m', slug);
          if (!params.get('m')) {
            params.set('m', storedSlug || 'king');
          }
          var queryString = '?' + params.toString();
          updateTenantMeta(params.get('m'), true);
          window.location.replace(repoPrefix + '/admin/' + queryString + hash);
          return;
        }

        // If asking for products (/products, /products/, /products/cashier.html)
        if (segments.indexOf('products') !== -1 || path.indexOf('/products') !== -1) {
          var subParts = segments.filter(function(s) { return s !== 'products'; });
          var subPath = subParts.length > 0 ? subParts.join('/') : '';
          window.location.replace('https://abdelraouf-harpy.github.io/products/' + (subPath ? subPath : '') + search + hash);
          return;
        }

        // If asking for portfolio explicitly (/portfolio, /portfolio.html)
        if (segments.indexOf('portfolio') !== -1 || path.indexOf('/portfolio') !== -1) {
          window.location.replace(repoPrefix + '/' + search + hash);
          return;
        }

        // If asking for order or restaurant slug in path (/saj, /king, /hermel, etc.)
        var remaining = segments.filter(function(s) { 
          return s !== 'index' && s !== 'products' && s !== 'portfolio' && !s.endsWith('.html'); 
        });
        var filtered = remaining.filter(function(s) { return s !== 'order'; });
        var slug = filtered.length > 0 ? filtered[0] : '';
        var params = new URLSearchParams(search);
        var resolvedSlug = slug || params.get('m') || storedSlug || 'king';
        params.set('m', resolvedSlug);
        updateTenantMeta(resolvedSlug, false);
        var queryString = '?' + params.toString();

        // Always route cleanly to /order/?m={slug}
        window.location.replace(repoPrefix + '/order/' + queryString + hash);
      } catch (e) {
        window.location.replace((repoPrefix || '') + '/order/?m=aloo');
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p style="font-weight:700; font-size:14px;">جاري توجيهك إلى صفحة المنيو...</p>
</body>
</html>
