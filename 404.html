<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنيو الإلكتروني الذكي — قائمة الطعام</title>
  <meta name="description" content="قائمة طعام رقمية تفاعلية بالباركود، اطلب وجبتك المفضلة أونلاين مباشرة عبر واتساب.">
  <meta property="og:type" content="restaurant.menu">
  <meta property="og:site_name" content="Harpy Order">
  <meta property="og:title" content="المنيو الإلكتروني الذكي — قائمة الطعام">
  <meta property="og:description" content="قائمة طعام رقمية تفاعلية بالباركود، اطلب وجبتك المفضلة أونلاين مباشرة عبر واتساب.">
  <meta property="og:image" content="https://harpymenu.com/assets/brand/og_banner.png">
  <link rel="icon" type="image/png" href="assets/brand/favicon.png">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #120e0c;
      color: #faf6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(234, 88, 12, 0.2);
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .not-found-box {
      max-width: 420px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 18px;
      padding: 28px 22px;
      display: none;
    }
    .not-found-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 11px 22px;
      border-radius: 10px;
      background: #ea580c;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
    }
  </style>
  <script>
    (function() {
      var TENANT_REGISTRY = {
        'aloo': { name: 'Aloo Burger', logo: 'https://res.cloudinary.com/pq2pimug/image/upload/v1793879648/ycssznrc2i1rf8abpyu2.jpg', desc: 'قائمة طعام Aloo Burger والطلب الإلكتروني المباشر' },
        'elmetaashy': { name: 'El Metaashy', logo: 'https://res.cloudinary.com/pq2pimug/image/upload/v1794336402/mnl4qazblj9bhwpnocy5.jpg', desc: 'الجوع لما ينادي.. المتعشي هو الحل 🍔🔥' },
        'king': { name: 'king', logo: 'https://res.cloudinary.com/pq2pimug/image/upload/v1794005707/fekgebaclepbe4hmt4ga.jpg', desc: 'أشهى المشويات، البرجر الفاخر، والبيتزا الإيطالية على أصولها' }
      };

      function updateTenantMeta(slug, isAdmin) {
        try {
          var t = TENANT_REGISTRY[slug] || {};
          var name = t.name || slug;
          var logo = t.logo || 'https://harpymenu.com/assets/brand/og_banner.png';
          var desc = t.desc || (isAdmin ? ('لوحة التحكم السحابية لمطعم ' + name) : ('قائمة طعام ' + name + ' والطلب أونلاين'));
          var title = isAdmin ? ('لوحة إدارة ' + name + ' — Harpy Admin') : ('منيو ' + name + ' — قائمة الطعام والطلبات');
          document.title = title;
          var mTitle = document.querySelector('meta[property="og:title"]');
          if (mTitle) mTitle.content = title;
          var mDesc = document.querySelector('meta[property="og:description"]');
          if (mDesc) mDesc.content = desc;
          var mImg = document.querySelector('meta[property="og:image"]');
          if (mImg) mImg.content = logo;
        } catch(e) {}
      }

      function showNotFound(slug, repoPrefix) {
        try {
          document.title = '404 — المطعم غير موجود';
          var p = slug ? ('harpy_' + slug + '_') : '';
          if (p) {
            for (var i = localStorage.length - 1; i >= 0; i--) {
              var k = localStorage.key(i);
              if (k && k.indexOf(p) === 0) localStorage.removeItem(k);
            }
          }
        } catch(e) {}
        function render() {
          var sp = document.getElementById('route-spinner');
          var lb = document.getElementById('route-label');
          var box = document.getElementById('not-found-box');
          var homeLink = document.getElementById('not-found-home');
          if (sp) sp.style.display = 'none';
          if (lb) lb.style.display = 'none';
          if (homeLink) homeLink.href = (repoPrefix || '') + '/';
          if (box) box.style.display = 'block';
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', render);
        } else {
          render();
        }
      }

      function resolveAndRedirect(targetSlug, targetUrl, isAdmin, repoPrefix) {
        var clean = String(targetSlug || '').toLowerCase().trim();
        if (!clean || clean === 'demo' || TENANT_REGISTRY[clean]) {
          updateTenantMeta(clean, isAdmin);
          window.location.replace(targetUrl);
          return;
        }
        // Unknown or recently added/deleted slug: check Firebase RTDB license before routing
        var controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var tid = controller ? setTimeout(function() { try { controller.abort(); } catch(e) {} }, 2500) : null;
        fetch('https://harpy-order-default-rtdb.firebaseio.com/licenses/' + encodeURIComponent(clean) + '.json', {
          cache: 'no-store',
          signal: controller ? controller.signal : undefined
        })
          .then(function(r) { return r.ok ? r.json().then(function(d) { return { ok: true, d: d }; }) : { ok: false, d: null }; })
          .then(function(res) {
            if (tid) clearTimeout(tid);
            if (res.ok && (res.d === null || (res.d && res.d.status === 'deleted'))) {
              showNotFound(clean, repoPrefix);
              return;
            }
            updateTenantMeta(clean, isAdmin);
            window.location.replace(targetUrl);
          })
          .catch(function() {
            if (tid) clearTimeout(tid);
            updateTenantMeta(clean, isAdmin);
            window.location.replace(targetUrl);
          });
      }

      var repoPrefix = '';
      try {
        var path = window.location.pathname || '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var segments = path.split('/').filter(Boolean);

        // Detect GitHub Pages repo subfolder (e.g. /links/)
        if (window.location.hostname.includes('github.io') && segments.length > 0) {
          var first = segments[0].toLowerCase();
          var standardPages = ['order.html', 'admin.html', 'index.html', 'portfolio.html', '404.html', 'products.html', 'sw.js', 'manifest.json'];
          if (!standardPages.includes(first) && !first.endsWith('.html') && !first.endsWith('.json')) {
            repoPrefix = '/' + segments[0];
            segments.shift();
          }
        }

        // Check legacy restaurant-specific files and manifests
        for (var i = 0; i < segments.length; i++) {
          var seg = segments[i].toLowerCase();
          if (seg.indexOf('admin-manifest-') !== -1) {
            var mSlug = seg.replace(/admin-manifest-([^.]+)\.json/, '$1');
            resolveAndRedirect(mSlug, repoPrefix + '/admin-manifest.json?m=' + encodeURIComponent(mSlug), true, repoPrefix);
            return;
          }
          if (seg.indexOf('manifest-') !== -1) {
            var mSlug2 = seg.replace(/manifest-([^.]+)\.json/, '$1');
            resolveAndRedirect(mSlug2, repoPrefix + '/manifest.json?m=' + encodeURIComponent(mSlug2), false, repoPrefix);
            return;
          }
          if (seg.endsWith('-admin.html') || seg.startsWith('admin-')) {
            var rSlug = seg.replace('-admin.html', '').replace('admin-', '').replace('.html', '');
            if (rSlug) {
              resolveAndRedirect(rSlug, repoPrefix + '/admin.html?m=' + encodeURIComponent(rSlug) + (search ? ('&' + search.slice(1)) : '') + hash, true, repoPrefix);
              return;
            }
          }
          if (seg.endsWith('.html') && seg !== 'index.html' && seg !== 'order.html' && seg !== 'admin.html' && seg !== 'portfolio.html' && seg !== '404.html') {
            var rSlug2 = seg.replace('.html', '');
            if (rSlug2) {
              resolveAndRedirect(rSlug2, repoPrefix + '/order.html?m=' + encodeURIComponent(rSlug2) + (search ? ('&' + search.slice(1)) : '') + hash, false, repoPrefix);
              return;
            }
          }
        }

        var storedSlug = '';
        try {
          storedSlug = localStorage.getItem('harpy_admin_active_slug') ||
                       localStorage.getItem('harpy_active_slug') ||
                       localStorage.getItem('harpy_customer_installed_slug') ||
                       localStorage.getItem('harpy_last_visited_slug') || '';
        } catch(e) {}

        // If asking for admin (/admin, /admin/, /admin/{slug}, /order/admin/{slug}, /admin?m=slug)
        if (segments.indexOf('admin') !== -1 || path.indexOf('/admin') !== -1) {
          var remaining = segments.filter(function(s) { return s !== 'admin' && s !== 'order' && !s.endsWith('.html'); });
          var slug = remaining.length > 0 ? remaining[0] : '';
          var params = new URLSearchParams(search);
          if (slug && !params.get('m')) params.set('m', slug);
          var finalAdminSlug = params.get('m') || storedSlug || 'king';
          params.set('m', finalAdminSlug);
          resolveAndRedirect(finalAdminSlug, repoPrefix + '/admin/?' + params.toString() + hash, true, repoPrefix);
          return;
        }

        // Check if landing with an admin tab hash (#orders, #products, #categories, etc.)
        var adminHashes = ['orders', 'products', 'categories', 'stories', 'settings', 'backup', 'pos'];
        var cleanHash = hash.replace('#', '').trim();
        if (adminHashes.indexOf(cleanHash) !== -1) {
          var remAdmin = segments.filter(function(s) { return s !== 'admin' && s !== 'order' && !s.endsWith('.html'); });
          var pathSlug = remAdmin.length > 0 ? remAdmin[0] : '';
          var aSlug = pathSlug || storedSlug || 'king';
          resolveAndRedirect(aSlug, repoPrefix + '/admin/?m=' + encodeURIComponent(aSlug) + '#' + cleanHash, true, repoPrefix);
          return;
        }

        // If asking for products (/products, /products/, /products/cashier.html)
        if (segments.indexOf('products') !== -1 || path.indexOf('/products') !== -1) {
          var subParts = segments.filter(function(s) { return s !== 'products'; });
          var subPath = subParts.length > 0 ? subParts.join('/') : '';
          window.location.replace('https://abdelraouf-harpy.github.io/products/' + (subPath ? subPath : '') + search + hash);
          return;
        }

        // If asking for portfolio explicitly (/portfolio, /portfolio.html)
        if (segments.indexOf('portfolio') !== -1 || path.indexOf('/portfolio') !== -1) {
          window.location.replace(repoPrefix + '/' + search + hash);
          return;
        }

        // Order/menu or restaurant slug in path (/{slug}, /order/{slug}, /menu/{slug})
        var remainingMenu = segments.filter(function(s) {
          return s !== 'index' && s !== 'products' && s !== 'portfolio' && !s.endsWith('.html');
        });
        var filteredMenu = remainingMenu.filter(function(s) { return s !== 'order' && s !== 'menu'; });
        var mPathSlug = filteredMenu.length > 0 ? filteredMenu[0] : '';
        var menuParams = new URLSearchParams(search);
        var resolvedSlug = mPathSlug || menuParams.get('m') || storedSlug || 'king';
        menuParams.set('m', resolvedSlug);
        resolveAndRedirect(resolvedSlug, repoPrefix + '/order/?' + menuParams.toString() + hash, false, repoPrefix);
      } catch (e) {
        window.location.replace((repoPrefix || '') + '/order/?m=king');
      }
    })();
  </script>
</head>
<body>
  <div id="route-spinner" class="spinner"></div>
  <p id="route-label" style="font-weight:700; font-size:14px;">جاري توجيهك إلى صفحة المنيو...</p>
  <div id="not-found-box" class="not-found-box">
    <h2 style="margin:0 0 8px 0; font-size:20px; color:#f87171;">المطعم غير موجود (404)</h2>
    <p style="margin:0; font-size:13.5px; color:#cbd5e1; line-height:1.65;">
      عذراً، هذا الرابط غير مرتبط بأي مطعم نشط حالياً أو تم حذفه نهائياً من المنصة.
    </p>
    <a id="not-found-home" href="/" class="not-found-btn">العودة للصفحة الرئيسية</a>
  </div>
</body>
</html>
