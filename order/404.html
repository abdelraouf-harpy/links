<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري تحويلك إلى المنيو...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #120e0c;
      color: #faf6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(234, 88, 12, 0.2);
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      try {
        var path = window.location.pathname || '';
        var search = window.location.search || '';
        var hash = window.location.hash || '';
        var segments = path.split('/').filter(Boolean);

        // Check if landing with an admin tab hash (#orders, #products, #categories, etc.)
        var adminHashes = ['orders', 'products', 'categories', 'stories', 'settings', 'backup'];
        var cleanHash = hash.replace('#', '').trim();
        if (adminHashes.indexOf(cleanHash) !== -1) {
          var slug = localStorage.getItem('harpy_active_slug') || 'king';
          window.location.replace('/admin?m=' + encodeURIComponent(slug) + '#' + cleanHash);
          return;
        }
        
        // If asking for admin (/admin, /admin/, /admin?m=slug)
        if (segments.indexOf('admin') !== -1 || path.indexOf('/admin') !== -1) {
          var remaining = segments.filter(function(s) { return s !== 'admin' && s !== 'order' && !s.endsWith('.html'); });
          var slug = remaining.length > 0 ? remaining[0] : '';
          var params = new URLSearchParams(search);
          if (slug && !params.get('m')) params.set('m', slug);
          if (!params.get('m')) {
            var savedSlug = localStorage.getItem('harpy_active_slug') || 'king';
            params.set('m', savedSlug);
          }
          var queryString = '?' + params.toString();
          window.location.replace('/admin.html' + queryString + hash);
          return;
        }

        // If asking for order or restaurant slug in path (/king, /hermel, etc.)
        var remaining = segments.filter(function(s) { return s !== 'order' && s !== 'index' && !s.endsWith('.html'); });
        var slug = remaining.length > 0 ? remaining[0] : '';
        var params = new URLSearchParams(search);
        if (slug && !params.get('m')) params.set('m', slug);
        var queryString = params.toString() ? ('?' + params.toString()) : '';

        // Always redirect to absolute /index.html (never relative ./)
        window.location.replace('/index.html' + queryString + hash);
      } catch (e) {
        window.location.replace('/index.html' + (window.location.search || ''));
      }
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p style="font-weight:700; font-size:14px;">جاري توجيهك إلى صفحة المنيو...</p>
</body>
</html>
