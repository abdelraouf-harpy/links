<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري تحويلك إلى المنيو...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #120e0c;
      color: #faf6f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(234, 88, 12, 0.2);
      border-top-color: #ea580c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;

      // Extract parts from path: e.g. /order/hermel or /order/admin/hermel
      var segments = path.split('/').filter(Boolean);
      
      if (segments.length > 0) {
        var last = segments[segments.length - 1];
        var isOrderRoot = segments[0] === 'order';
        
        // Check if asking for admin
        if (segments.indexOf('admin') !== -1) {
          var slug = (last === 'admin') ? '' : last;
          var target = (isOrderRoot ? '/order/admin.html' : '/admin.html') + (slug ? '?m=' + encodeURIComponent(slug) : search) + hash;
          window.location.replace(target);
          return;
        }

        // If path is e.g. /order/hermel or /hermel
        var slug = last.replace(/\.html$/, '');
        if (slug && slug !== 'order' && slug !== 'index') {
          var target = (isOrderRoot ? '/order/' : '/') + '?m=' + encodeURIComponent(slug) + (hash || '');
          window.location.replace(target);
          return;
        }
      }

      // Default fallback
      window.location.replace('./index.html' + search + hash);
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p style="font-weight:700; font-size:14px;">جاري توجيهك إلى صفحة المنيو...</p>
</body>
</html>
