<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      var path = window.location.pathname || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      if (path.includes('admin') || search.includes('admin')) {
        window.location.replace('/order/admin.html' + search + hash);
        return;
      }
      var p = new URLSearchParams(search);
      if (p.get('m') || p.get('r') || p.get('restaurant')) {
        window.location.replace('/order/' + search + hash);
        return;
      }
      window.location.replace('/');
    })();
  </script>
  <title>Harpy</title>
</head>
<body style="background:#120e0c; color:#fff; text-align:center; padding-top:30vh; font-family:sans-serif;">
  <p style="font-size:16px; font-weight:700;">جاري التوجيه...</p>
</body>
</html>
