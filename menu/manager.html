<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>لوحة المدير — QR Menu</title>
  <meta name="description" content="لوحة إدارة منيو مطعمك">
  <link rel="stylesheet" href="./css/app.css">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6366f1">
  <link rel="apple-touch-icon" href="./pwa-icon.png">
  <style>
    /* ── Manager-specific styles ── */
    .item-card-list {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      padding: 12px 14px;
      margin-bottom: 10px;
      transition: var(--tr-base);
    }
    .item-card-list:hover { border-color: var(--border2); background: var(--surface3); }
    .item-list-img {
      width: 56px; height: 56px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface3);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .item-list-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
    .item-list-body { flex: 1; min-width: 0; }
    .item-list-name { font-size: 14px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-list-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .item-list-price { font-size: 15px; font-weight: 900; color: #22c55e; font-family: 'Outfit', sans-serif; flex-shrink: 0; }
    .item-list-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .cat-tile {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--r-md);
      overflow: hidden;
      transition: var(--tr-base);
    }
    .cat-tile:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .cat-tile-img { width: 100%; height: 100px; object-fit: cover; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-size: 36px; }
    .cat-tile-img img { width: 100%; height: 100%; object-fit: cover; }
    .cat-tile-body { padding: 14px; }
    .cat-tile-name { font-size: 14px; font-weight: 900; margin-bottom: 4px; }
    .cat-tile-en   { font-size: 11px; color: var(--text-3); margin-bottom: 10px; }
    .cat-tile-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    .extras-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
    .extra-row {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface3); border-radius: var(--r-sm); padding: 8px 12px;
    }
    .extra-row-name { flex: 1; font-size: 13px; font-weight: 700; }
    .extra-row-price { font-size: 12px; color: var(--success); font-weight: 900; font-family: 'Outfit', sans-serif; }

    .restaurant-info-form .form-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    @media (max-width: 640px) {
      .restaurant-info-form .form-row { grid-template-columns: 1fr; }
      .cat-grid { grid-template-columns: 1fr 1fr; }
    }

    .preview-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--success); font-size: 12px; font-weight: 700;
      padding: 7px 14px; border-radius: var(--r-sm);
      background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2);
      transition: var(--tr-fast);
    }
    .preview-link:hover { background: rgba(34,197,94,0.2); }
  </style>
</head>
<body>

<!-- Page Loader -->
<div id="page-loader">
  <div class="loader-logo">🍴</div>
  <div class="loader-dots">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
</div>

<!-- Header -->
<header class="app-header">
  <button class="sidebar-toggle" id="sidebar-toggle" aria-label="القائمة">☰</button>
  <div class="brand-logo" style="background:linear-gradient(135deg,#6366f1,#4f46e5)">🍴</div>
  <div class="brand-text" style="flex:1">
    <div class="name" id="header-rest-name">جاري التحميل...</div>
    <div class="sub">Manager Dashboard</div>
  </div>
  <div class="flex gap-2 items-center">
    <a id="menu-preview-btn" href="#" target="_blank" class="preview-link hide-mobile">👁️ معاينة المنيو</a>
    <button class="btn btn-ghost btn-sm" id="logout-btn">خروج</button>
  </div>
</header>

<div class="app-layout">
  <!-- Sidebar Backdrop -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="app-sidebar">
    <button class="nav-item active" data-nav="categories">
      <span class="nav-icon">📂</span> الأقسام
    </button>
    <button class="nav-item" data-nav="items">
      <span class="nav-icon">🍽️</span> الوجبات
    </button>
    <div class="nav-divider"></div>
    <button class="nav-item" data-nav="restaurant">
      <span class="nav-icon">⚙️</span> بيانات المطعم
    </button>
    <div class="nav-divider"></div>
    <a id="sidebar-preview" href="#" target="_blank" class="nav-item" style="color:var(--success);">
      <span class="nav-icon">👁️</span> عرض المنيو
    </a>
  </aside>

  <!-- Main Content -->
  <main class="content-area">

    <!-- ═══ CATEGORIES ════════════════════════════════════════ -->
    <section id="nav-categories" class="nav-section">
      <div class="section-head">
        <h2 class="section-title">📂 أقسام المنيو</h2>
        <button class="btn btn-primary btn-sm" id="btn-add-cat">+ قسم جديد</button>
      </div>
      <div class="cat-grid" id="cat-grid">
        <div class="skeleton" style="height:160px;"></div>
        <div class="skeleton" style="height:160px;"></div>
        <div class="skeleton" style="height:160px;"></div>
      </div>
    </section>

    <!-- ═══ ITEMS ════════════════════════════════════════════ -->
    <section id="nav-items" class="nav-section hidden">
      <div class="section-head">
        <h2 class="section-title">🍽️ الوجبات</h2>
        <div class="flex gap-2">
          <select class="input input-sm" id="item-filter-cat" style="min-width:150px;"></select>
          <button class="btn btn-primary btn-sm" id="btn-add-item">+ وجبة جديدة</button>
        </div>
      </div>
      <div id="items-list">
        <div class="skeleton" style="height:72px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:72px;margin-bottom:8px;"></div>
        <div class="skeleton" style="height:72px;"></div>
      </div>
    </section>

    <!-- ═══ RESTAURANT INFO ═══════════════════════════════════ -->
    <section id="nav-restaurant" class="nav-section hidden">
      <div class="section-head">
        <h2 class="section-title">⚙️ بيانات المطعم</h2>
        <button class="btn btn-primary btn-sm" id="btn-save-info">💾 حفظ</button>
      </div>

      <div class="card restaurant-info-form" style="max-width:720px;">
        <!-- Images -->
        <div class="form-row" style="margin-bottom:20px;">
          <div>
            <label class="field-label">الشعار (Logo)</label>
            <div class="img-drop" onclick="document.getElementById('logo-file').click()">
              <input type="file" id="logo-file" accept="image/*" style="display:none" onchange="previewImg(this,'logo-preview')">
              <div class="img-drop-icon">🖼️</div>
              <div class="img-drop-text">اضغط لرفع الشعار</div>
              <img id="logo-preview" class="img-drop-preview" src="" alt="">
            </div>
            <input class="input input-sm" type="text" id="logo-url" placeholder="أو الصق رابط الشعار المباشر هنا..." style="margin-top:8px;" oninput="document.getElementById('logo-preview').src=this.value; document.getElementById('logo-preview').style.display=this.value?'block':'none';">
          </div>
          <div>
            <label class="field-label">صورة الغلاف</label>
            <div class="img-drop" onclick="document.getElementById('cover-file').click()">
              <input type="file" id="cover-file" accept="image/*" style="display:none" onchange="previewImg(this,'cover-preview')">
              <div class="img-drop-icon">🌄</div>
              <div class="img-drop-text">اضغط لرفع الغلاف</div>
              <img id="cover-preview" class="img-drop-preview" src="" alt="">
            </div>
            <input class="input input-sm" type="text" id="cover-url" placeholder="أو الصق رابط الغلاف المباشر هنا..." style="margin-top:8px;" oninput="document.getElementById('cover-preview').src=this.value; document.getElementById('cover-preview').style.display=this.value?'block':'none';">
          </div>
        </div>

        <div class="form-row">
          <div class="field-group"><label class="field-label">اسم المطعم *</label><input class="input" type="text" id="r-name" placeholder="اسم مطعمك"></div>
          <div class="field-group"><label class="field-label">العملة</label><input class="input" type="text" id="r-currency" placeholder="ج.م" maxlength="10"></div>
        </div>
        <div class="field-group">
          <label class="field-label">وصف مختصر</label>
          <input class="input" type="text" id="r-tagline" placeholder="أفضل المأكولات الشعبية في المدينة">
        </div>
        <div class="field-group">
          <label class="field-label">العنوان</label>
          <input class="input" type="text" id="r-address" placeholder="شارع، حي، مدينة">
        </div>
        <div class="form-row">
          <div class="field-group"><label class="field-label">الهاتف</label><input class="input" type="tel" id="r-phone" placeholder="010xxxxxxxx"></div>
          <div class="field-group"><label class="field-label">واتساب</label><input class="input" type="tel" id="r-whatsapp" placeholder="010xxxxxxxx"></div>
        </div>
        <div class="form-row">
          <div class="field-group"><label class="field-label">إنستقرام</label><input class="input" type="text" id="r-instagram" placeholder="@username"></div>
          <div class="field-group"><label class="field-label">فيسبوك</label><input class="input" type="text" id="r-facebook" placeholder="page_name"></div>
        </div>

        <div class="alert alert-info" style="margin-top:8px;">
          🔗 رابط المنيو: <a id="menu-url-display" href="#" target="_blank" style="color:#60a5fa;font-weight:900;"></a>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- ═══ MODAL: Add/Edit Category ═══════════════════════════ -->
<div class="modal-overlay" id="cat-modal">
  <div class="modal-bg" onclick="closeModal('cat-modal')"></div>
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title" id="cat-modal-title">قسم جديد</h3>
      <button class="modal-close-btn" onclick="closeModal('cat-modal')">✕</button>
    </div>
    <input type="hidden" id="cat-edit-id">
    <div class="field-group">
      <label class="field-label">الاسم بالعربي *</label>
      <input class="input" type="text" id="cat-name-ar" placeholder="مثال: مقبلات">
    </div>
    <div class="field-group">
      <label class="field-label">الاسم بالإنجليزي</label>
      <input class="input" type="text" id="cat-name-en" placeholder="Starters">
    </div>
    <div class="field-group">
      <label class="field-label">الترتيب</label>
      <input class="input" type="number" id="cat-order" value="0" min="0">
    </div>
    <div class="field-group">
      <label class="field-label">صورة القسم</label>
      <div class="img-drop" onclick="document.getElementById('cat-img-file').click()">
        <input type="file" id="cat-img-file" accept="image/*" style="display:none" onchange="previewImg(this,'cat-img-preview')">
        <div class="img-drop-icon">📷</div>
        <div class="img-drop-text">اضغط لاختيار صورة</div>
        <img id="cat-img-preview" class="img-drop-preview" src="" alt="">
      </div>
      <input class="input input-sm" type="text" id="cat-img-url" placeholder="أو الصق رابط صورة القسم المباشر هنا..." style="margin-top:8px;" oninput="document.getElementById('cat-img-preview').src=this.value; document.getElementById('cat-img-preview').style.display=this.value?'block':'none';">
    </div>
    <div class="flex gap-3 mt-4">
      <button class="btn btn-primary flex-1" id="cat-save-btn">✅ حفظ</button>
      <button class="btn btn-ghost" onclick="closeModal('cat-modal')">إلغاء</button>
    </div>
  </div>
</div>

<!-- ═══ MODAL: Add/Edit Item ════════════════════════════════ -->
<div class="modal-overlay" id="item-modal">
  <div class="modal-bg" onclick="closeModal('item-modal')"></div>
  <div class="modal-box">
    <div class="modal-head">
      <h3 class="modal-title" id="item-modal-title">وجبة جديدة</h3>
      <button class="modal-close-btn" onclick="closeModal('item-modal')">✕</button>
    </div>
    <input type="hidden" id="item-edit-id">
    <input type="hidden" id="item-edit-cat-id">

    <div class="grid-2" style="gap:14px;">
      <div class="field-group">
        <label class="field-label">الاسم بالعربي *</label>
        <input class="input" type="text" id="item-name-ar" placeholder="برجر لحم">
      </div>
      <div class="field-group">
        <label class="field-label">الاسم بالإنجليزي</label>
        <input class="input" type="text" id="item-name-en" placeholder="Beef Burger">
      </div>
    </div>

    <div class="grid-2" style="gap:14px;">
      <div class="field-group">
        <label class="field-label">السعر *</label>
        <input class="input" type="number" id="item-price" placeholder="0.00" step="0.01" min="0">
      </div>
      <div class="field-group">
        <label class="field-label">القسم *</label>
        <select class="input" id="item-cat-sel"></select>
      </div>
    </div>

    <div class="field-group">
      <label class="field-label">الوصف بالعربي</label>
      <textarea class="input" id="item-desc-ar" rows="2" placeholder="وصف الصنف..."></textarea>
    </div>
    <div class="field-group">
      <label class="field-label">الوصف بالإنجليزي</label>
      <textarea class="input" id="item-desc-en" rows="2" placeholder="Item description..."></textarea>
    </div>

    <div class="grid-2" style="gap:14px;margin-bottom:14px;">
      <label class="toggle-wrap">
        <span id="toggle-avail" class="toggle on"></span>
        <span class="toggle-label">متاح للطلب</span>
      </label>
      <label class="toggle-wrap">
        <span id="toggle-featured" class="toggle off"></span>
        <span class="toggle-label">صنف مميز ⭐</span>
      </label>
    </div>

    <div class="field-group">
      <label class="field-label">الصورة</label>
      <div class="img-drop" onclick="document.getElementById('item-img-file').click()">
        <input type="file" id="item-img-file" accept="image/*" style="display:none" onchange="previewImg(this,'item-img-preview')">
        <div class="img-drop-icon">🍽️</div>
        <div class="img-drop-text">اضغط لاختيار صورة الوجبة</div>
        <img id="item-img-preview" class="img-drop-preview" src="" alt="">
      </div>
      <input class="input input-sm" type="text" id="item-img-url" placeholder="أو الصق رابط صورة الوجبة المباشر هنا..." style="margin-top:8px;" oninput="document.getElementById('item-img-preview').src=this.value; document.getElementById('item-img-preview').style.display=this.value?'block':'none';">
    </div>

    <!-- Extras -->
    <div class="divider"></div>
    <div class="flex items-center justify-between" style="margin-bottom:8px;">
      <label class="field-label" style="margin:0;">الإضافات (Extras)</label>
      <button class="btn btn-ghost btn-sm" id="btn-add-extra">+ إضافة</button>
    </div>
    <div id="extras-form" style="display:none;background:rgba(99,102,241,0.05);border:1px solid rgba(99,102,241,0.15);border-radius:var(--r-md);padding:14px;margin-bottom:12px;">
      <div class="grid-2" style="gap:10px;margin-bottom:10px;">
        <div><label class="field-label">الاسم *</label><input class="input input-sm" type="text" id="extra-name-ar" placeholder="بارميزان إضافي"></div>
        <div><label class="field-label">السعر الإضافي</label><input class="input input-sm" type="number" id="extra-price" placeholder="0.00" step="0.01" value="0" min="0"></div>
      </div>
      <button class="btn btn-success btn-sm w-full" id="btn-save-extra">✓ إضافة</button>
    </div>
    <div id="extras-list" class="extras-list"></div>

    <div class="flex gap-3 mt-4">
      <button class="btn btn-primary flex-1" id="item-save-btn">✅ حفظ</button>
      <button class="btn btn-ghost" onclick="closeModal('item-modal')">إلغاء</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script type="module">
import { auth, db, storage } from './js/firebase.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getUserProfile, getRestaurantById,
  getCategories, createCategory, updateCategory, deleteCategory,
  getItems, getAllItems, createItem, updateItem, deleteItem,
  updateRestaurant, uploadImage
} from './js/db.js';
import { toast, openModal, closeModal, hideLoader, initSidebar } from './js/utils.js';

// ── State ──────────────────────────────────────────────────
let currentUser = null;
let restaurant  = null;
let categories  = [];
let editingCatId   = null;
let editingItemId  = null;
let editingItemCatId = null;
let currentExtras = [];
let toggleAvail    = true;
let toggleFeatured = false;

// ── Auth Guard ────────────────────────────────────────────
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = './login.html'; return; }
  currentUser = user;
  const profile = await getUserProfile(user.uid);
  if (!profile) { window.location.href = './login.html'; return; }
  if (profile.role === 'ADMIN') { window.location.href = './platform.html'; return; }
  restaurant = await getRestaurantById(profile.restaurantId);
  if (!restaurant) { alert('خطأ: لم يتم العثور على المطعم'); return; }
  initPage();
});

// ── Init ──────────────────────────────────────────────────
async function initPage() {
  document.getElementById('header-rest-name').textContent = restaurant.name;
  const menuUrl = `menu.html?r=${restaurant.slug}`;
  document.getElementById('menu-preview-btn').href = menuUrl;
  document.getElementById('sidebar-preview').href = menuUrl;
  document.getElementById('menu-url-display').href = menuUrl;
  document.getElementById('menu-url-display').textContent = new URL(menuUrl, window.location.href).href;
  fillRestaurantForm();
  await loadCategories();
  hideLoader();
  initSidebar();
  initNavigation();
  initToggleButtons();
  document.getElementById('logout-btn').addEventListener('click', async () => {
    await signOut(auth);
    window.location.href = './login.html';
  });
}

// ── Navigation ────────────────────────────────────────────
function initNavigation() {
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.nav;
      document.querySelectorAll('.nav-section').forEach(s => s.classList.add('hidden'));
      document.querySelectorAll('[data-nav]').forEach(b => b.classList.remove('active'));
      document.getElementById('nav-'+target).classList.remove('hidden');
      btn.classList.add('active');
      // Close sidebar on mobile
      document.getElementById('app-sidebar')?.classList.remove('open');
      document.getElementById('sidebar-backdrop')?.classList.remove('open');
      if (target === 'items') loadItems();
    });
  });
}

// ── Toggle Buttons ────────────────────────────────────────
function initToggleButtons() {
  document.getElementById('toggle-avail').addEventListener('click', function() {
    toggleAvail = !toggleAvail;
    this.classList.toggle('on', toggleAvail);
    this.classList.toggle('off', !toggleAvail);
  });
  document.getElementById('toggle-featured').addEventListener('click', function() {
    toggleFeatured = !toggleFeatured;
    this.classList.toggle('on', toggleFeatured);
    this.classList.toggle('off', !toggleFeatured);
  });
}

// ── Image Preview ─────────────────────────────────────────
window.previewImg = function(input, previewId) {
  if (input.files?.[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById(previewId);
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(input.files[0]);
  }
};

// ── CATEGORIES ────────────────────────────────────────────
async function loadCategories() {
  categories = await getCategories(restaurant.id);
  renderCategories();
  populateCatSelects();
}

function renderCategories() {
  const grid = document.getElementById('cat-grid');
  if (!categories.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
      <div class="empty-icon">📂</div>
      <div class="empty-title">لا توجد أقسام بعد</div>
      <div class="empty-text">أضف أول قسم في منيوك</div>
    </div>`;
    return;
  }
  grid.innerHTML = categories.map(c => `
    <div class="cat-tile">
      <div class="cat-tile-img">
        ${c.image ? `<img src="${c.image}" alt="${c.nameAr}">` : '📂'}
      </div>
      <div class="cat-tile-body">
        <div class="cat-tile-name">${c.nameAr}</div>
        ${c.nameEn ? `<div class="cat-tile-en">${c.nameEn}</div>` : ''}
        <div class="cat-tile-actions">
          <button class="btn btn-ghost btn-sm" onclick="openEditCat('${c.id}')">✏️ تعديل</button>
          <button class="btn btn-danger btn-sm" onclick="removeCat('${c.id}')">🗑️</button>
          <span class="badge ${c.isActive !== false ? 'badge-green' : 'badge-red'}">${c.isActive !== false ? 'ظاهر' : 'مخفي'}</span>
        </div>
      </div>
    </div>`).join('');
}

function populateCatSelects() {
  const opts = categories.map(c => `<option value="${c.id}">${c.nameAr}</option>`).join('');
  ['item-cat-sel', 'item-filter-cat'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const prefix = id === 'item-filter-cat' ? '<option value="">كل الأقسام</option>' : '';
    el.innerHTML = prefix + opts;
  });
}

document.getElementById('btn-add-cat').addEventListener('click', () => {
  editingCatId = null;
  document.getElementById('cat-modal-title').textContent = 'قسم جديد';
  document.getElementById('cat-name-ar').value = '';
  document.getElementById('cat-name-en').value = '';
  document.getElementById('cat-order').value   = categories.length;
  document.getElementById('cat-img-preview').style.display = 'none';
  document.getElementById('cat-img-file').value = '';
  document.getElementById('cat-img-url').value = '';
  openModal('cat-modal');
});

window.openEditCat = function(id) {
  const cat = categories.find(c => c.id === id);
  if (!cat) return;
  editingCatId = id;
  document.getElementById('cat-modal-title').textContent = 'تعديل القسم';
  document.getElementById('cat-name-ar').value = cat.nameAr || '';
  document.getElementById('cat-name-en').value = cat.nameEn || '';
  document.getElementById('cat-order').value   = cat.order || 0;
  document.getElementById('cat-img-url').value = cat.image || '';
  const prev = document.getElementById('cat-img-preview');
  if (cat.image) { prev.src = cat.image; prev.style.display = 'block'; }
  else prev.style.display = 'none';
  openModal('cat-modal');
};

document.getElementById('cat-save-btn').addEventListener('click', async () => {
  const nameAr = document.getElementById('cat-name-ar').value.trim();
  if (!nameAr) { toast('الاسم بالعربي مطلوب', 'error'); return; }
  const btn = document.getElementById('cat-save-btn');
  btn.disabled = true; btn.textContent = '...';
  try {
    const imgUrlVal = document.getElementById('cat-img-url').value.trim();
    let imageUrl = imgUrlVal || (editingCatId ? categories.find(c=>c.id===editingCatId)?.image : null);
    const imgFile = document.getElementById('cat-img-file').files[0];
    if (imgFile && !imgUrlVal) {
      try {
        imageUrl = await uploadImage(imgFile, `restaurants/${restaurant.id}/categories`);
      } catch (err) {
        toast('فشل رفع الصورة سحابياً. يمكنك استخدام رابط مباشر.', 'warning');
      }
    }
    const data = {
      nameAr, nameEn: document.getElementById('cat-name-en').value.trim(),
      order: parseInt(document.getElementById('cat-order').value) || 0,
      isActive: true, image: imageUrl || null
    };
    if (editingCatId) await updateCategory(restaurant.id, editingCatId, data);
    else await createCategory(restaurant.id, data);
    toast(editingCatId ? 'تم التعديل ✅' : 'تمت الإضافة ✅');
    closeModal('cat-modal');
    await loadCategories();
  } catch(e) { toast('خطأ: ' + e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '✅ حفظ'; }
});

window.removeCat = async function(id) {
  const cat = categories.find(c => c.id === id);
  if (!cat) return;
  if (!confirm(`حذف قسم "${cat.nameAr}"؟ سيتم حذف جميع الوجبات فيه.`)) return;
  try {
    await deleteCategory(restaurant.id, id);
    toast('تم الحذف');
    await loadCategories();
    await loadItems();
  } catch(e) { toast('خطأ في الحذف', 'error'); }
};

// ── ITEMS ──────────────────────────────────────────────────
async function loadItems() {
  const catId = document.getElementById('item-filter-cat').value;
  let items;
  if (catId) {
    items = await getItems(restaurant.id, catId);
    items = items.map(i => ({ ...i, categoryId: catId, categoryName: categories.find(c=>c.id===catId)?.nameAr }));
  } else {
    items = await getAllItems(restaurant.id);
  }
  renderItems(items);
}

function renderItems(items) {
  const list = document.getElementById('items-list');
  if (!items.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🍽️</div>
      <div class="empty-title">لا توجد وجبات بعد</div>
      <div class="empty-text">أضف أول وجبة في قسم من الأقسام</div>
    </div>`;
    return;
  }
  list.innerHTML = items.map(item => `
    <div class="item-card-list">
      <div class="item-list-img">
        ${item.image ? `<img src="${item.image}" alt="${item.nameAr}">` : '🍽️'}
      </div>
      <div class="item-list-body">
        <div class="item-list-name">${item.nameAr}${item.nameEn ? ' / '+item.nameEn : ''}</div>
        <div class="item-list-meta">
          ${item.categoryName || '—'}
          ${item.isAvailable === false ? ' · <span style="color:var(--danger)">غير متاح</span>' : ''}
          ${item.isFeatured ? ' · ⭐' : ''}
          ${item.extras?.length ? ` · ${item.extras.length} إضافة` : ''}
        </div>
      </div>
      <div class="item-list-price">${parseFloat(item.price||0).toFixed(2)}</div>
      <div class="item-list-actions">
        <button class="btn btn-ghost btn-sm" onclick="openEditItem('${item.id}','${item.categoryId}')">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="removeItem('${item.id}','${item.categoryId}')">🗑️</button>
      </div>
    </div>`).join('');
}

document.getElementById('item-filter-cat').addEventListener('change', loadItems);

document.getElementById('btn-add-item').addEventListener('click', () => {
  editingItemId = null; editingItemCatId = null;
  currentExtras = [];
  document.getElementById('item-modal-title').textContent = 'وجبة جديدة';
  document.getElementById('item-name-ar').value = '';
  document.getElementById('item-name-en').value = '';
  document.getElementById('item-price').value   = '';
  document.getElementById('item-desc-ar').value = '';
  document.getElementById('item-desc-en').value = '';
  document.getElementById('item-img-preview').style.display = 'none';
  document.getElementById('item-img-file').value = '';
  document.getElementById('item-img-url').value = '';
  toggleAvail = true; toggleFeatured = false;
  document.getElementById('toggle-avail').className = 'toggle on';
  document.getElementById('toggle-featured').className = 'toggle off';
  renderExtras();
  document.getElementById('extras-form').style.display = 'none';
  openModal('item-modal');
});

window.openEditItem = async function(itemId, catId) {
  editingItemId = itemId; editingItemCatId = catId;
  const items = await getItems(restaurant.id, catId);
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  currentExtras = item.extras ? [...item.extras] : [];
  document.getElementById('item-modal-title').textContent = 'تعديل الوجبة';
  document.getElementById('item-name-ar').value = item.nameAr || '';
  document.getElementById('item-name-en').value = item.nameEn || '';
  document.getElementById('item-price').value   = parseFloat(item.price||0).toFixed(2);
  document.getElementById('item-desc-ar').value = item.descAr || '';
  document.getElementById('item-desc-en').value = item.descEn || '';
  document.getElementById('item-cat-sel').value = catId;
  document.getElementById('item-img-url').value = item.image || '';
  toggleAvail    = item.isAvailable !== false;
  toggleFeatured = item.isFeatured === true;
  document.getElementById('toggle-avail').className    = 'toggle ' + (toggleAvail ? 'on' : 'off');
  document.getElementById('toggle-featured').className = 'toggle ' + (toggleFeatured ? 'on' : 'off');
  const prev = document.getElementById('item-img-preview');
  if (item.image) { prev.src = item.image; prev.style.display = 'block'; }
  else prev.style.display = 'none';
  renderExtras();
  document.getElementById('extras-form').style.display = 'none';
  openModal('item-modal');
};

document.getElementById('item-save-btn').addEventListener('click', async () => {
  const nameAr = document.getElementById('item-name-ar').value.trim();
  const price  = document.getElementById('item-price').value;
  const catId  = document.getElementById('item-cat-sel').value;
  if (!nameAr || !price || !catId) { toast('الاسم والسعر والقسم مطلوبون', 'error'); return; }
  const btn = document.getElementById('item-save-btn');
  btn.disabled = true; btn.textContent = '...';
  try {
    const imgUrlVal = document.getElementById('item-img-url').value.trim();
    let imageUrl = imgUrlVal || (editingItemId ? (await getItems(restaurant.id, editingItemCatId)).find(i=>i.id===editingItemId)?.image : null);
    const imgFile = document.getElementById('item-img-file').files[0];
    if (imgFile && !imgUrlVal) {
      try {
        imageUrl = await uploadImage(imgFile, `restaurants/${restaurant.id}/items`);
      } catch (err) {
        toast('فشل رفع الصورة سحابياً. يمكنك استخدام رابط مباشر.', 'warning');
      }
    }
    const data = {
      nameAr, nameEn: document.getElementById('item-name-en').value.trim(),
      price: parseFloat(price),
      descAr: document.getElementById('item-desc-ar').value.trim(),
      descEn: document.getElementById('item-desc-en').value.trim(),
      isAvailable: toggleAvail, isFeatured: toggleFeatured,
      image: imageUrl || null, extras: currentExtras
    };
    if (editingItemId) {
      const newCatId = catId;
      await updateItem(restaurant.id, editingItemCatId, editingItemId, data);
    } else {
      await createItem(restaurant.id, catId, data);
    }
    toast(editingItemId ? 'تم التعديل ✅' : 'تمت الإضافة ✅');
    closeModal('item-modal');
    await loadItems();
  } catch(e) { toast('خطأ: ' + e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '✅ حفظ'; }
});

window.removeItem = async function(id, catId) {
  const items = await getItems(restaurant.id, catId);
  const item = items.find(i => i.id === id);
  if (!item) return;
  if (!confirm(`حذف "${item.nameAr}"؟`)) return;
  try { await deleteItem(restaurant.id, catId, id); toast('تم الحذف'); await loadItems(); }
  catch(e) { toast('خطأ في الحذف', 'error'); }
};

// ── EXTRAS ────────────────────────────────────────────────
document.getElementById('btn-add-extra').addEventListener('click', () => {
  const f = document.getElementById('extras-form');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  if (f.style.display === 'block') document.getElementById('extra-name-ar').focus();
});

document.getElementById('btn-save-extra').addEventListener('click', () => {
  const name = document.getElementById('extra-name-ar').value.trim();
  if (!name) { toast('الاسم مطلوب', 'error'); return; }
  currentExtras.push({
    nameAr: name,
    price: parseFloat(document.getElementById('extra-price').value) || 0
  });
  document.getElementById('extra-name-ar').value = '';
  document.getElementById('extra-price').value = '0';
  document.getElementById('extras-form').style.display = 'none';
  renderExtras();
});

function renderExtras() {
  const list = document.getElementById('extras-list');
  if (!currentExtras.length) {
    list.innerHTML = `<div style="text-align:center;color:var(--text-3);font-size:12px;padding:8px;">لا توجد إضافات</div>`;
    return;
  }
  list.innerHTML = currentExtras.map((e,i) => `
    <div class="extra-row">
      <span class="extra-row-name">${e.nameAr}</span>
      <span class="extra-row-price">+${parseFloat(e.price||0).toFixed(2)}</span>
      <button class="btn btn-danger btn-sm" onclick="removeExtra(${i})" style="margin-right:4px;">✕</button>
    </div>`).join('');
}

window.removeExtra = function(i) {
  currentExtras.splice(i, 1);
  renderExtras();
};

// ── RESTAURANT INFO ────────────────────────────────────────
function fillRestaurantForm() {
  const fields = { 'r-name': 'name', 'r-currency': 'currency', 'r-tagline': 'tagline',
                   'r-address': 'address', 'r-phone': 'phone', 'r-whatsapp': 'whatsapp',
                   'r-instagram': 'instagram', 'r-facebook': 'facebook' };
  for (const [id, field] of Object.entries(fields)) {
    const el = document.getElementById(id);
    if (el) el.value = restaurant[field] || '';
  }
  document.getElementById('logo-url').value = restaurant.logo || '';
  document.getElementById('cover-url').value = restaurant.cover || '';
  if (restaurant.logo) {
    const lp = document.getElementById('logo-preview');
    lp.src = restaurant.logo; lp.style.display = 'block';
  }
  if (restaurant.cover) {
    const cp = document.getElementById('cover-preview');
    cp.src = restaurant.cover; cp.style.display = 'block';
  }
}

document.getElementById('btn-save-info').addEventListener('click', async () => {
  const btn = document.getElementById('btn-save-info');
  btn.disabled = true; btn.textContent = '...';
  try {
    const logoUrlVal = document.getElementById('logo-url').value.trim();
    const coverUrlVal = document.getElementById('cover-url').value.trim();
    let logo  = logoUrlVal || restaurant.logo  || null;
    let cover = coverUrlVal || restaurant.cover || null;
    const logoFile  = document.getElementById('logo-file').files[0];
    const coverFile = document.getElementById('cover-file').files[0];
    
    if (logoFile && !logoUrlVal) {
      try {
        logo = await uploadImage(logoFile, `restaurants/${restaurant.id}/logos`);
      } catch (err) {
        toast('فشل رفع الشعار سحابياً. يمكنك استخدام رابط مباشر.', 'warning');
      }
    }
    if (coverFile && !coverUrlVal) {
      try {
        cover = await uploadImage(coverFile, `restaurants/${restaurant.id}/covers`);
      } catch (err) {
        toast('فشل رفع الغلاف سحابياً. يمكنك استخدام رابط مباشر.', 'warning');
      }
    }
    const data = {
      name: document.getElementById('r-name').value.trim(),
      currency:  document.getElementById('r-currency').value.trim() || 'ج.م',
      tagline:   document.getElementById('r-tagline').value.trim(),
      address:   document.getElementById('r-address').value.trim(),
      phone:     document.getElementById('r-phone').value.trim(),
      whatsapp:  document.getElementById('r-whatsapp').value.trim(),
      instagram: document.getElementById('r-instagram').value.trim(),
      facebook:  document.getElementById('r-facebook').value.trim(),
      logo, cover
    };
    await updateRestaurant(restaurant.id, data);
    restaurant = { ...restaurant, ...data };
    document.getElementById('header-rest-name').textContent = data.name;
    toast('تم حفظ بيانات المطعم ✅');
  } catch(e) { toast('خطأ: ' + e.message, 'error'); }
  finally { btn.disabled = false; btn.textContent = '💾 حفظ'; }
});

window.openModal  = openModal;
window.closeModal = closeModal;
</script>

        .catch(err => console.log('Service Worker registration failed', err));
    });
