<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Table {{ table.table_number }}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f1f5f9; }
        @media print {
            .no-print { display: none; }
            body { background: white; }
            .qr-card { border: none; box-shadow: none; margin: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="qr-card bg-white p-10 rounded-[40px] shadow-2xl border border-slate-200 text-center max-w-sm w-full">
        <h1 class="text-3xl font-black text-slate-900 mb-2">{{ restaurant.name }}</h1>
        <p class="text-slate-500 font-bold mb-8 uppercase tracking-widest text-xs">Table #{{ table.table_number }}</p>
        
        <div id="qrcode" class="flex justify-center mb-8 p-4 bg-white border-4 border-slate-900 rounded-3xl shadow-inner"></div>
        
        <p class="text-slate-400 text-[10px] font-bold mb-10 leading-relaxed">Scan to view digital menu and place your order instantly.</p>
        
        <div class="no-print space-y-3">
            <button onclick="window.print()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-sm active:scale-95 transition">Print QR Code</button>
            <a href="/m/{{ restaurant.slug }}/?t={{ table.unique_token }}" class="block text-slate-400 font-bold text-xs hover:underline">Preview Menu</a>
        </div>
    </div>

    <script>
        const tableUrl = window.location.origin + "/m/{{ restaurant.slug }}/?t={{ table.unique_token }}";
        new QRCode(document.getElementById("qrcode"), {
            text: tableUrl,
            width: 256,
            height: 256,
            colorDark : "#0f172a",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
