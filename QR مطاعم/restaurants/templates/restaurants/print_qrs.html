<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print QRs - {{ restaurant.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { background: white; }
            .qr-card { break-inside: avoid; border: 1px solid #eee; margin-bottom: 20px; }
        }
    </style>
</head>
<body class="bg-gray-100 p-8">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10 no-print">
            <h1 class="text-2xl font-bold">طباعة أكواد الطاولات - {{ restaurant.name }}</h1>
            <button onclick="window.print()" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold">إبدأ الطباعة</button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-8">
            {% for table in tables %}
            <div class="qr-card bg-white p-6 rounded-2xl shadow-sm text-center flex flex-col items-center">
                <img src="{% url 'generate-qr' table.unique_token %}" class="w-48 h-48 mb-4">
                <div class="text-xl font-bold text-gray-800">طاولة {{ table.table_number }}</div>
                <div class="text-xs text-gray-400 mt-1">{{ restaurant.name }}</div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
