<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — CloudMenu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated background orbs */
        body::before {
            content: '';
            position: fixed;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
            top: -200px; right: -100px;
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(239,68,68,0.08) 0%, transparent 70%);
            bottom: -150px; left: -100px;
            border-radius: 50%;
            pointer-events: none;
        }

        .login-card {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(20px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.5);
            position: relative;
        }

        .input-field {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 14px 18px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
        }
        .input-field:focus {
            border-color: rgba(99,102,241,0.5);
            background: rgba(99,102,241,0.08);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
        }
        .input-field::placeholder { color: rgba(255,255,255,0.25); }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 32px rgba(99,102,241,0.35);
        }
        .btn-login:hover  { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(99,102,241,0.45); }
        .btn-login:active { transform: scale(0.97); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 99px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 900;
            color: rgba(255,255,255,0.5);
        }

        .error-box {
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 14px;
            padding: 12px 16px;
            color: #fca5a5;
            font-size: 13px;
            font-weight: 700;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .login-card { animation: fadeUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-10">
            <div style="width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#4f46e5);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 16px 40px rgba(99,102,241,0.4);margin-bottom:20px;">
                🍴
            </div>
            <h1 style="font-size:22px;font-weight:900;color:white;margin-bottom:4px;">CloudMenu</h1>
            <p style="font-size:12px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.1em;">Restaurant Management Platform</p>
        </div>

        <!-- Available Roles Info -->
        <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px;">
            <span class="role-badge">🔥 طاهٍ</span>
            <span class="role-badge">🙋 نادل</span>
            <span class="role-badge">📊 مالك</span>
            <span class="role-badge">🌐 أدمن</span>
        </div>

        <!-- Error Message -->
        {% if error %}
        <div class="error-box mb-6">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="{% url 'staff-login' %}" id="login-form">
            {% csrf_token %}
            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:12px;font-weight:900;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">اسم المستخدم</label>
                <input
                    type="text"
                    name="username"
                    class="input-field"
                    placeholder="أدخل اسم المستخدم"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>
            <div style="margin-bottom:28px;">
                <label style="display:block;font-size:12px;font-weight:900;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;">كلمة المرور</label>
                <div style="position:relative;">
                    <input
                        type="password"
                        name="password"
                        id="password-input"
                        class="input-field"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                        style="padding-left:48px;"
                    >
                    <button type="button" onclick="togglePassword()" style="position:absolute;left:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,0.3);cursor:pointer;font-size:18px;padding:0;" id="eye-btn">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn-login" id="submit-btn">
                تسجيل الدخول
            </button>
        </form>

        <!-- Footer -->
        <div style="text-align:center;margin-top:24px;">
            <p style="font-size:11px;color:rgba(255,255,255,0.2);font-weight:700;">
                CloudMenu SaaS v1.0 — لوحة تحكم الموظفين
            </p>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password-input');
            const btn = document.getElementById('eye-btn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = '🙈';
            } else {
                input.type = 'password';
                btn.innerText = '👁️';
            }
        }

        document.getElementById('login-form').onsubmit = function() {
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = '...جاري الدخول';
        };
    </script>
</body>
</html>
